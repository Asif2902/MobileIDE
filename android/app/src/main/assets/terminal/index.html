<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MobileIDE Terminal</title>
  <link rel="stylesheet" href="./xterm.min.css">
  <style>
    /* Do NOT set word-break / white-space:pre-wrap on .xterm-rows.
       xterm owns the cell grid; CSS wrapping mangles columns and makes the
       terminal look "buggy" (paths split mid-word, prompt wrapping wrong). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1e1e1e; }
    #terminal { width: 100%; height: 100%; padding: 2px; overflow: hidden; }
    .xterm { height: 100%; width: 100%; }
    .xterm-viewport { overflow-y: auto !important; overflow-x: hidden !important; }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script src="./xterm.min.js"></script>
  <script src="./addon-fit.min.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontSize: 12,
      fontFamily: 'monospace',
      lineHeight: 1.2,
      scrollback: 5000,
      convertEol: true,
      theme: {
        background: '#1e1e1e',
        foreground: '#d4d4d4',
        cursor: '#d4d4d4',
        cursorAccent: '#1e1e1e',
        selectionBackground: '#264f78',
        black: '#1e1e1e',
        red: '#f44747',
        green: '#6a9955',
        yellow: '#d7ba7d',
        blue: '#569cd6',
        magenta: '#c586c0',
        cyan: '#4ec9b0',
        white: '#d4d4d4',
        brightBlack: '#808080',
        brightRed: '#f44747',
        brightGreen: '#6a9955',
        brightYellow: '#d7ba7d',
        brightBlue: '#569cd6',
        brightMagenta: '#c586c0',
        brightCyan: '#4ec9b0',
        brightWhite: '#ffffff'
      },
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    // NOTE: The WebGL renderer is intentionally NOT used. In Android WebView the
    // GPU context is easily lost (and contexts are limited when several terminal
    // WebViews are mounted at once); when that happens the WebGL addon disposes
    // itself and xterm renders a blank screen - the "nothing shows up" bug. The
    // default DOM renderer is slower but always paints reliably on-device.

    term.open(document.getElementById('terminal'));

    // --- Robust fitting --------------------------------------------------------
    // On phones the terminal must re-fit whenever the usable area changes:
    // orientation flips, the soft keyboard opening/closing (which shrinks the
    // WebView because the Activity uses adjustResize), and RN panel resizes.
    // A single fit() at load is not enough - if the first layout pass reports a
    // stale/landscape size the columns stay too wide and text is clipped in
    // portrait. We therefore fit on load, on every resize, and via a
    // ResizeObserver on the container so any size change is caught.
    let fitScheduled = false;
    function safeFit() {
      fitScheduled = false;
      try {
        if (term.element && term.element.clientWidth > 0) {
          fitAddon.fit();
        }
      } catch (e) { /* ignore transient layout errors */ }
    }
    function scheduleFit() {
      if (fitScheduled) return;
      fitScheduled = true;
      requestAnimationFrame(safeFit);
    }

    // Initial fit after layout settles.
    requestAnimationFrame(safeFit);
    setTimeout(safeFit, 60);
    setTimeout(safeFit, 300);

    window.addEventListener('resize', scheduleFit);
    if (window.visualViewport) {
      // Fires when the soft keyboard changes the visible viewport height.
      window.visualViewport.addEventListener('resize', scheduleFit);
    }
    try {
      const ro = new ResizeObserver(scheduleFit);
      ro.observe(document.getElementById('terminal'));
    } catch (e) { /* ResizeObserver unavailable - resize/visualViewport cover it */ }

    // --- Input plumbing --------------------------------------------------------
    function sendInput(data) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'input', data: data }));
    }

    // --- Modifier state (Termux-style Ctrl / Alt) ------------------------------
    // The extra-keys bar (native side) "arms" Ctrl or Alt; the next character the
    // user types - whether from the soft keyboard or the bar - is transformed
    // here and the modifier auto-clears. This mirrors how Termux behaves.
    let ctrlArmed = false;
    let altArmed = false;
    function notifyModifier() {
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: 'modifier', ctrl: ctrlArmed, alt: altArmed
      }));
    }
    function applyModifiers(data) {
      if (!data || (!ctrlArmed && !altArmed)) return data;
      let out = data;
      if (ctrlArmed && out.length > 0) {
        const c = out.charCodeAt(0);
        let mapped = null;
        if (c >= 97 && c <= 122) mapped = c - 96;        // a-z  -> 0x01-0x1a
        else if (c >= 65 && c <= 90) mapped = c - 64;    // A-Z  -> 0x01-0x1a
        else if (c === 32) mapped = 0;                   // space-> NUL
        else if (c >= 91 && c <= 95) mapped = c - 64;    // [ \ ] ^ _
        if (mapped !== null) out = String.fromCharCode(mapped) + out.slice(1);
      }
      if (altArmed && out.length > 0) {
        out = '\x1b' + out; // ESC prefix = Meta/Alt
      }
      ctrlArmed = false;
      altArmed = false;
      notifyModifier();
      return out;
    }

    // --- Android soft-keyboard (IME) hardening ---------------------------------
    // xterm.js reads keystrokes from a hidden <textarea>. On Android the IME
    // (Gboard etc.) enables autocomplete/prediction which commits whole "random"
    // words, and routes Backspace/Delete through composition `input` events
    // (keyCode 229) that xterm never sees, so deleting appears to do nothing.
    // We disable prediction and translate the editing `beforeinput` events into
    // the raw control bytes the PTY expects.
    function hardenAndroidInput() {
      const ta = document.querySelector('.xterm-helper-textarea');
      if (!ta) return;
      ta.setAttribute('autocorrect', 'off');
      ta.setAttribute('autocapitalize', 'none');
      ta.setAttribute('autocomplete', 'off');
      ta.setAttribute('spellcheck', 'false');
      ta.setAttribute('enterkeyhint', 'send');
      ta.addEventListener('beforeinput', (e) => {
        const t = e.inputType;
        if (t === 'deleteContentBackward') {
          e.preventDefault();
          sendInput('\x7f');
        } else if (t === 'deleteContentForward') {
          e.preventDefault();
          sendInput('\x1b[3~');
        } else if (t === 'deleteWordBackward') {
          e.preventDefault();
          sendInput('\x17'); // Ctrl-W
        } else if (t === 'insertLineBreak' || t === 'insertParagraph') {
          e.preventDefault();
          sendInput('\r');
        }
      });
    }
    hardenAndroidInput();

    term.onData((data) => {
      sendInput(applyModifiers(data));
    });

    term.onResize(({ cols, rows }) => {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'resize', cols: cols, rows: rows }));
    });

    // --- Clipboard via React Native (Android WebView clipboard is unreliable) ----
    function copyToNative(text) {
      if (!text) { return; }
      try { term.focus(); } catch (e) {}
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'copyText', text: text }));
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'copied', length: text.length }));
    }

    function getBufferText() {
      try {
        const buf = term.buffer.active;
        const lines = [];
        for (let i = 0; i < buf.length; i++) {
          const line = buf.getLine(i);
          if (line) { lines.push(line.translateToString(true)); }
        }
        return lines.join('\n').replace(/\n+$/, '');
      } catch (e) {
        return '';
      }
    }

    function handleCopyCommand() {
      const sel = term.getSelection();
      if (sel && sel.length > 0) {
        copyToNative(sel);
      } else {
        // No selection: open RN modal so the user can select & copy with native handles.
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'openSelectionModal',
          bufferText: getBufferText()
        }));
      }
    }

    function requestPasteFromNative() {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'requestPaste' }));
    }

    document.addEventListener('message', (event) => { handleMessage(event.data); });
    window.addEventListener('message', (event) => { handleMessage(event.data); });

    function handleMessage(data) {
      try {
        const message = JSON.parse(data);
        switch (message.type) {
          case 'output': term.write(message.data); break;
          case 'clear': term.clear(); break;
          case 'resize': term.resize(message.cols, message.rows); break;
          case 'fit': scheduleFit(); break;
          case 'theme': term.options.theme = message.theme; break;
          case 'fontSize': term.options.fontSize = message.size; scheduleFit(); break;
          case 'focus': term.focus(); break;
          case 'blur': term.blur(); break;
          case 'selectAll': term.selectAll(); break;
          case 'openSelectModal':
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'openSelectionModal',
              bufferText: getBufferText()
            }));
            break;
          // Extra-keys bar: a fully-formed byte sequence (arrows, F-keys, etc.).
          case 'key': sendInput(message.data); break;
          case 'armCtrl': ctrlArmed = !ctrlArmed; notifyModifier(); term.focus(); break;
          case 'armAlt': altArmed = !altArmed; notifyModifier(); term.focus(); break;
          case 'clearModifiers': ctrlArmed = false; altArmed = false; notifyModifier(); break;
          case 'copy': handleCopyCommand(); break;
          case 'requestPasteFromNative': requestPasteFromNative(); break;
          case 'pasteText':
            if (message.data) { sendInput(message.data); }
            break;
          case 'paste': requestPasteFromNative(); break;
          case 'getSelection':
            window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'selection', data: term.getSelection() }));
            break;
        }
      } catch (e) { console.error('Error handling message:', e); }
    }

    window.ReactNativeWebView.postMessage(JSON.stringify({
      type: 'ready', cols: term.cols, rows: term.rows
    }));

    document.getElementById('terminal').addEventListener('touchstart', () => { term.focus(); });
  </script>
</body>
</html>
