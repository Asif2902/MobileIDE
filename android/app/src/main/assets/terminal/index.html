<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MobileIDE Terminal</title>
  <link rel="stylesheet" href="./xterm.min.css">
  <style>
    /* xterm owns the cell grid — do not CSS-wrap rows (breaks columns). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      /* React Native's SafeAreaView already applies the device insets. Applying
         viewport safe-area values again inside this WebView pushed row 1 well
         below the top of the terminal on cutout devices. */
      padding: 0;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 2px 6px 0;
      overflow: hidden;
    }
    .xterm { height: 100% !important; width: 100% !important; padding: 0 !important; }
    .xterm-viewport {
      overflow-y: auto !important;
      overflow-x: auto !important; /* long lines scroll horizontally, never clip off-screen forever */
      -webkit-overflow-scrolling: touch;
    }
    .xterm-screen { will-change: transform; }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script src="./xterm.min.js"></script>
  <script src="./addon-fit.min.js"></script>
  <script>
    // Phone vs tablet: smaller font on narrow widths so more columns fit.
    function pickFontSize() {
      const w = Math.min(window.innerWidth || 360, (window.visualViewport && window.visualViewport.width) || 9999);
      if (w < 360) return 9;
      if (w < 480) return 10;
      if (w < 700) return 12;
      if (w < 1000) return 13;
      return 14;
    }

    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontSize: pickFontSize(),
      fontFamily: 'Menlo, Consolas, "Courier New", monospace',
      lineHeight: 1.15,
      letterSpacing: 0,
      scrollback: 3000,
      convertEol: true,
      // Draw slightly beyond edges so last column isn't cut by WebView chrome
      windowsMode: false,
      theme: {
        background: '#1e1e1e',
        foreground: '#d4d4d4',
        cursor: '#d4d4d4',
        cursorAccent: '#1e1e1e',
        selectionBackground: '#264f78',
        black: '#1e1e1e',
        red: '#f44747',
        green: '#6a9955',
        yellow: '#d7ba7d',
        blue: '#569cd6',
        magenta: '#c586c0',
        cyan: '#4ec9b0',
        white: '#d4d4d4',
        brightBlack: '#808080',
        brightRed: '#f44747',
        brightGreen: '#6a9955',
        brightYellow: '#d7ba7d',
        brightBlue: '#569cd6',
        brightMagenta: '#c586c0',
        brightCyan: '#4ec9b0',
        brightWhite: '#ffffff'
      },
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));

    // --- Robust fit for phone + tablet + keyboard ------------------------------
    let fitScheduled = false;
    let lastCols = 0;
    let lastRows = 0;

    function safeFit() {
      fitScheduled = false;
      try {
        const el = term.element;
        if (!el || el.clientWidth < 20 || el.clientHeight < 20) return;

        // Re-pick font when rotating phone ↔ tablet
        const fs = pickFontSize();
        if (term.options.fontSize !== fs) {
          term.options.fontSize = fs;
        }

        fitAddon.fit();

        // Never report zero / absurd sizes to the PTY
        const cols = Math.max(20, Math.min(term.cols || 80, 200));
        const rows = Math.max(5, Math.min(term.rows || 24, 80));
        if (cols !== term.cols || rows !== term.rows) {
          try { term.resize(cols, rows); } catch (e) {}
        }
        if (cols !== lastCols || rows !== lastRows) {
          lastCols = cols;
          lastRows = rows;
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'resize', cols: cols, rows: rows
          }));
        }
      } catch (e) { /* ignore transient layout errors */ }
    }

    function scheduleFit() {
      if (fitScheduled) return;
      fitScheduled = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(safeFit);
      });
    }

    requestAnimationFrame(safeFit);
    setTimeout(safeFit, 50);
    setTimeout(safeFit, 200);
    setTimeout(safeFit, 500);

    window.addEventListener('resize', scheduleFit);
    window.addEventListener('orientationchange', function () {
      setTimeout(scheduleFit, 100);
      setTimeout(scheduleFit, 400);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleFit);
      window.visualViewport.addEventListener('scroll', scheduleFit);
    }
    try {
      new ResizeObserver(scheduleFit).observe(document.getElementById('terminal'));
    } catch (e) {}

    // --- Input -----------------------------------------------------------------
    function sendInput(data) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'input', data: data }));
    }

    let ctrlArmed = false;
    let altArmed = false;
    function notifyModifier() {
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: 'modifier', ctrl: ctrlArmed, alt: altArmed
      }));
    }
    function applyModifiers(data) {
      if (!data || (!ctrlArmed && !altArmed)) return data;
      let out = data;
      if (ctrlArmed && out.length > 0) {
        const c = out.charCodeAt(0);
        let mapped = null;
        if (c >= 97 && c <= 122) mapped = c - 96;
        else if (c >= 65 && c <= 90) mapped = c - 64;
        else if (c === 32) mapped = 0;
        else if (c >= 91 && c <= 95) mapped = c - 64;
        if (mapped !== null) out = String.fromCharCode(mapped) + out.slice(1);
      }
      if (altArmed && out.length > 0) out = '\x1b' + out;
      ctrlArmed = false;
      altArmed = false;
      notifyModifier();
      return out;
    }

    let lastXtermInput = '';
    let lastXtermInputAt = 0;

    function isMirroredXtermInput(data, now) {
      if (data && data === lastXtermInput && now - lastXtermInputAt < 120) {
        lastXtermInput = '';
        lastXtermInputAt = 0;
        return true;
      }
      return false;
    }

    function compositionPatch(previous, next) {
      const before = Array.from(previous || '');
      const after = Array.from(next || '');
      let shared = 0;
      while (
        shared < before.length &&
        shared < after.length &&
        before[shared] === after[shared]
      ) {
        shared++;
      }
      return {
        erase: before.length - shared,
        insert: after.slice(shared).join('')
      };
    }

    function hardenAndroidInput() {
      const ta = document.querySelector('.xterm-helper-textarea');
      if (!ta) return;
      ta.setAttribute('autocorrect', 'off');
      ta.setAttribute('autocapitalize', 'none');
      ta.setAttribute('autocomplete', 'off');
      ta.setAttribute('spellcheck', 'false');
      ta.setAttribute('enterkeyhint', 'send');

      let composing = false;
      let compositionText = '';

      function stopNativeEdit(e) {
        if (e.cancelable) e.preventDefault();
        e.stopImmediatePropagation();
      }

      function reconcileComposition(nextText) {
        const next = nextText || '';
        const patch = compositionPatch(compositionText, next);
        if (patch.erase > 0) sendInput('\x7f'.repeat(patch.erase));
        if (patch.insert) sendInput(applyModifiers(patch.insert));
        compositionText = next;
      }

      // Android WebView can report an entire `adb input text` operation as a
      // stream of keyCode 229 events. xterm's delayed textarea diff then sees
      // overlapping values and emits duplicated fragments (pri-ri-int...). Let
      // beforeinput/composition below own only those IME events; normal hardware
      // key events still follow xterm's proven VT key mapping.
      term.attachCustomKeyEventHandler((event) => {
        if (
          event.type === 'keydown' &&
          (event.keyCode === 229 || event.which === 229 || event.key === 'Unidentified')
        ) {
          return false;
        }
        return true;
      });

      // Capture composition before xterm's listeners. Reconcile incremental
      // text so Gboard/autocorrect can replace a composing suffix without ever
      // sending the same prefix twice.
      ta.addEventListener('compositionstart', (e) => {
        composing = true;
        compositionText = '';
        ta.value = '';
        e.stopImmediatePropagation();
      }, true);
      ta.addEventListener('compositionupdate', (e) => {
        reconcileComposition(e.data || '');
        e.stopImmediatePropagation();
      }, true);
      ta.addEventListener('compositionend', (e) => {
        reconcileComposition(e.data || compositionText);
        composing = false;
        compositionText = '';
        ta.value = '';
        e.stopImmediatePropagation();
      }, true);

      ta.addEventListener('beforeinput', (e) => {
        const t = e.inputType;
        let data = null;

        if (t === 'insertText' || t === 'insertReplacementText') {
          data = e.data || '';
        } else if (t === 'insertCompositionText' || t === 'insertFromComposition') {
          stopNativeEdit(e);
          if (!composing) composing = true;
          reconcileComposition(e.data || compositionText);
          if (t === 'insertFromComposition') composing = false;
          ta.value = '';
          return;
        } else if (t === 'deleteCompositionText') {
          stopNativeEdit(e);
          reconcileComposition('');
          ta.value = '';
          return;
        } else if (t === 'deleteContentBackward') {
          data = '\x7f';
        } else if (t === 'deleteContentForward') {
          data = '\x1b[3~';
        } else if (t === 'deleteWordBackward') {
          data = '\x17';
        } else if (t === 'insertLineBreak' || t === 'insertParagraph') {
          data = '\r';
        }

        if (data !== null) {
          stopNativeEdit(e);
          if (data && !isMirroredXtermInput(data, Date.now())) {
            sendInput(applyModifiers(data));
          }
          ta.value = '';
        }
      }, true);
    }
    hardenAndroidInput();

    term.onData((data) => {
      lastXtermInput = data;
      lastXtermInputAt = Date.now();
      sendInput(applyModifiers(data));
    });
    term.onResize(function () { /* fit posts resize; avoid double-fire */ });

    function copyToNative(text) {
      if (!text) return;
      try { term.focus(); } catch (e) {}
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'copyText', text: text }));
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'copied', length: text.length }));
    }

    function getBufferText() {
      try {
        const buf = term.buffer.active;
        const logicalLines = [];
        let logicalLine = null;
        for (let i = 0; i < buf.length; i++) {
          const line = buf.getLine(i);
          if (!line) continue;
          const text = line.translateToString(true);

          // isWrapped belongs to the current physical row: it means this row
          // continues the preceding logical line. Join only those soft wraps;
          // every ordinary PTY newline remains a newline in the clipboard.
          if (line.isWrapped && logicalLine !== null) {
            logicalLine += text;
          } else {
            if (logicalLine !== null) logicalLines.push(logicalLine);
            logicalLine = text;
          }
        }
        if (logicalLine !== null) logicalLines.push(logicalLine);

        // The active buffer includes unused viewport rows after the cursor.
        // Remove those synthetic rows without removing intentional blank lines
        // in the middle of command output.
        while (logicalLines.length > 0 && logicalLines[logicalLines.length - 1] === '') {
          logicalLines.pop();
        }
        return logicalLines.join('\n');
      } catch (e) {
        return '';
      }
    }

    function handleCopyCommand() {
      const sel = term.getSelection();
      if (sel && sel.length > 0) {
        copyToNative(sel);
      } else {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'openSelectionModal',
          bufferText: getBufferText()
        }));
      }
    }

    function requestPasteFromNative() {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'requestPaste' }));
    }

    document.addEventListener('message', (event) => { handleMessage(event.data); });
    window.addEventListener('message', (event) => { handleMessage(event.data); });

    function handleMessage(data) {
      try {
        const message = JSON.parse(data);
        switch (message.type) {
          case 'output':
            term.write(message.data);
            // Keep cursor in view when lots of npm output scrolls
            try { term.scrollToBottom(); } catch (e) {}
            break;
          case 'clear': term.clear(); break;
          case 'resize':
            if (message.cols && message.rows) {
              try { term.resize(message.cols, message.rows); } catch (e) {}
            }
            break;
          case 'fit': scheduleFit(); break;
          case 'theme': term.options.theme = message.theme; break;
          case 'fontSize':
            term.options.fontSize = message.size;
            scheduleFit();
            break;
          case 'focus': term.focus(); scheduleFit(); break;
          case 'blur': term.blur(); break;
          case 'selectAll': term.selectAll(); break;
          case 'openSelectModal':
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'openSelectionModal',
              bufferText: getBufferText()
            }));
            break;
          case 'key': sendInput(message.data); break;
          case 'armCtrl': ctrlArmed = !ctrlArmed; notifyModifier(); term.focus(); break;
          case 'armAlt': altArmed = !altArmed; notifyModifier(); term.focus(); break;
          case 'clearModifiers': ctrlArmed = false; altArmed = false; notifyModifier(); break;
          case 'copy': handleCopyCommand(); break;
          case 'requestPasteFromNative': requestPasteFromNative(); break;
          case 'pasteText':
            if (message.data) sendInput(message.data);
            break;
          case 'paste': requestPasteFromNative(); break;
          case 'getSelection':
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'selection', data: term.getSelection()
            }));
            break;
        }
      } catch (e) { console.error('Error handling message:', e); }
    }

    window.ReactNativeWebView.postMessage(JSON.stringify({
      type: 'ready', cols: term.cols, rows: term.rows
    }));

    document.getElementById('terminal').addEventListener('touchstart', () => {
      term.focus();
      scheduleFit();
    });
  </script>
</body>
</html>
