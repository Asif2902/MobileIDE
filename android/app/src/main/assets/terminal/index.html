<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MobileIDE Terminal</title>
  <link rel="stylesheet" href="./xterm.min.css">
  <style>
    /* xterm owns the cell grid — do not CSS-wrap rows (breaks columns). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d12;
      /* React Native's SafeAreaView already applies the device insets. Applying
         viewport safe-area values again inside this WebView pushed row 1 well
         below the top of the terminal on cutout devices. */
      padding: 0;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 6px 9px 0;
      overflow: hidden;
    }
    .xterm { height: 100% !important; width: 100% !important; padding: 0 !important; }
    .xterm-viewport {
      overflow-y: auto !important;
      overflow-x: auto !important; /* long lines scroll horizontally, never clip off-screen forever */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
    }
    .xterm-screen { will-change: transform; }
    /* Copy affordance shown only after a deliberate hold on a live selection.
       Lives outside #terminal so its taps never reach the terminal's own
       touch listeners. */
    #hold-copy-bar {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: none;
      padding: 10px 26px;
      border-radius: 999px;
      border: none;
      background: #8b6cff;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
      z-index: 50;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script src="./xterm.min.js"></script>
  <script src="./addon-fit.min.js"></script>
  <script>
    // Phone vs tablet: smaller font on narrow widths so more columns fit.
    function pickFontSize() {
      const w = Math.min(window.innerWidth || 360, (window.visualViewport && window.visualViewport.width) || 9999);
      if (w < 360) return 11;
      if (w < 480) return 12;
      if (w < 700) return 13;
      if (w < 1000) return 13;
      return 14;
    }

    const FONT_SIZE_KEY = 'adev-terminal-font-size-v2';
    let hasSavedFontSize = false;
    function clampFontSize(value) {
      return Math.max(10, Math.min(22, Number(value) || pickFontSize()));
    }
    function loadFontSize() {
      try {
        const saved = window.localStorage.getItem(FONT_SIZE_KEY);
        if (saved !== null) {
          hasSavedFontSize = true;
          return clampFontSize(saved);
        }
      } catch (e) {}
      return pickFontSize();
    }
    function saveFontSize(value) {
      hasSavedFontSize = true;
      try { window.localStorage.setItem(FONT_SIZE_KEY, String(value)); } catch (e) {}
    }

    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontSize: loadFontSize(),
      fontFamily: 'Menlo, Consolas, "Courier New", monospace',
      lineHeight: 1.15,
      letterSpacing: 0,
      scrollback: 10000,
      convertEol: true,
      // Draw slightly beyond edges so last column isn't cut by WebView chrome
      windowsMode: false,
      theme: {
        background: '#0b0d12',
        foreground: '#dfe4ec',
        cursor: '#c8bbff',
        cursorAccent: '#0b0d12',
        selectionBackground: '#3b3262',
        black: '#0b0d12',
        red: '#f44747',
        green: '#6a9955',
        yellow: '#d7ba7d',
        blue: '#569cd6',
        magenta: '#c586c0',
        cyan: '#4ec9b0',
        white: '#d4d4d4',
        brightBlack: '#808080',
        brightRed: '#f44747',
        brightGreen: '#6a9955',
        brightYellow: '#d7ba7d',
        brightBlue: '#569cd6',
        brightMagenta: '#c586c0',
        brightCyan: '#4ec9b0',
        brightWhite: '#ffffff'
      },
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));

    // --- Robust fit for phone + tablet + keyboard ------------------------------
    let fitScheduled = false;
    let lastCols = 0;
    let lastRows = 0;

    function safeFit() {
      fitScheduled = false;
      try {
        const el = term.element;
        if (!el || el.clientWidth < 20 || el.clientHeight < 20) return;

        // Keep responsive defaults until the user deliberately zooms. A saved
        // zoom level must survive resize, keyboard changes and app restarts.
        const fs = hasSavedFontSize ? term.options.fontSize : pickFontSize();
        if (!hasSavedFontSize && term.options.fontSize !== fs) {
          term.options.fontSize = fs;
        }

        fitAddon.fit();

        // Never report zero / absurd sizes to the PTY
        const cols = Math.max(20, Math.min(term.cols || 80, 200));
        const rows = Math.max(5, Math.min(term.rows || 24, 80));
        if (cols !== term.cols || rows !== term.rows) {
          try { term.resize(cols, rows); } catch (e) {}
        }
        if (cols !== lastCols || rows !== lastRows) {
          lastCols = cols;
          lastRows = rows;
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'resize', cols: cols, rows: rows
          }));
        }
      } catch (e) { /* ignore transient layout errors */ }
    }

    function scheduleFit() {
      if (fitScheduled) return;
      fitScheduled = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(safeFit);
      });
    }

    requestAnimationFrame(safeFit);
    setTimeout(safeFit, 50);
    setTimeout(safeFit, 200);
    setTimeout(safeFit, 500);

    window.addEventListener('resize', scheduleFit);
    window.addEventListener('orientationchange', function () {
      setTimeout(scheduleFit, 100);
      setTimeout(scheduleFit, 400);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleFit);
      window.visualViewport.addEventListener('scroll', scheduleFit);
    }
    try {
      new ResizeObserver(scheduleFit).observe(document.getElementById('terminal'));
    } catch (e) {}

    // --- Input -----------------------------------------------------------------
    let submittedInputLine = '';
    let awaitingClearSequence = false;
    let pendingFullClear = false;
    let fullClearTimer = null;
    let clearSequenceProbe = '';

    function cancelFullClearTimer() {
      if (fullClearTimer !== null) clearTimeout(fullClearTimer);
      fullClearTimer = null;
    }

    function notifyBufferCleared() {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'bufferCleared' }));
    }

    function finishFullClear() {
      cancelFullClearTimer();
      awaitingClearSequence = false;
      pendingFullClear = false;
      clearSequenceProbe = '';
      queuedOutput = [];
      clearInteractionState();
      // xterm.clear() discards saved lines and the old viewport while retaining
      // the current prompt line. It never writes to, signals, or closes the PTY.
      try { term.clear(); } catch (e) {}
      try { term.scrollToBottom(); } catch (e) {}
      notifyBufferCleared();
    }

    function scheduleFullClear() {
      if (!pendingFullClear) return;
      cancelFullClearTimer();
      // Wait briefly for a separately chunked shell/SSH prompt. The current
      // line is retained when the saved buffer is discarded.
      fullClearTimer = setTimeout(finishFullClear, 80);
    }

    function observeSubmittedInput(data) {
      for (const character of Array.from(data || '')) {
        if (character === '\r' || character === '\n') {
          awaitingClearSequence = submittedInputLine.trim() === 'clear';
          submittedInputLine = '';
        } else if (character === '\x7f' || character === '\b') {
          submittedInputLine = Array.from(submittedInputLine).slice(0, -1).join('');
        } else if (character === '\x03' || character === '\x15') {
          submittedInputLine = '';
          awaitingClearSequence = false;
        } else if (character === '\x1b') {
          // History/cursor editing makes the local command line unknowable.
          // Avoid a false clear; the explicit CSI 3J handler still works.
          submittedInputLine = '';
        } else if (character >= ' ') {
          submittedInputLine += character;
        }
      }
    }

    function sendInput(data) {
      observeSubmittedInput(data);
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'input', data: data }));
    }

    let ctrlArmed = false;
    let altArmed = false;
    function notifyModifier() {
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: 'modifier', ctrl: ctrlArmed, alt: altArmed
      }));
    }
    function applyModifiers(data) {
      if (!data || (!ctrlArmed && !altArmed)) return data;
      let out = data;
      if (ctrlArmed && out.length > 0) {
        const c = out.charCodeAt(0);
        let mapped = null;
        if (c >= 97 && c <= 122) mapped = c - 96;
        else if (c >= 65 && c <= 90) mapped = c - 64;
        else if (c === 32) mapped = 0;
        else if (c >= 91 && c <= 95) mapped = c - 64;
        if (mapped !== null) out = String.fromCharCode(mapped) + out.slice(1);
      }
      if (altArmed && out.length > 0) out = '\x1b' + out;
      ctrlArmed = false;
      altArmed = false;
      notifyModifier();
      return out;
    }

    let lastXtermInput = '';
    let lastXtermInputAt = 0;

    function isMirroredXtermInput(data, now) {
      if (data && data === lastXtermInput && now - lastXtermInputAt < 120) {
        lastXtermInput = '';
        lastXtermInputAt = 0;
        return true;
      }
      return false;
    }

    function compositionPatch(previous, next) {
      const before = Array.from(previous || '');
      const after = Array.from(next || '');
      let shared = 0;
      while (
        shared < before.length &&
        shared < after.length &&
        before[shared] === after[shared]
      ) {
        shared++;
      }
      return {
        erase: before.length - shared,
        insert: after.slice(shared).join('')
      };
    }

    function hardenAndroidInput() {
      const ta = document.querySelector('.xterm-helper-textarea');
      if (!ta) return;
      ta.setAttribute('autocorrect', 'off');
      ta.setAttribute('autocapitalize', 'none');
      ta.setAttribute('autocomplete', 'off');
      ta.setAttribute('spellcheck', 'false');
      ta.setAttribute('enterkeyhint', 'send');

      let composing = false;
      let compositionText = '';

      function stopNativeEdit(e) {
        if (e.cancelable) e.preventDefault();
        e.stopImmediatePropagation();
      }

      function reconcileComposition(nextText) {
        const next = nextText || '';
        const patch = compositionPatch(compositionText, next);
        if (patch.erase > 0) sendInput('\x7f'.repeat(patch.erase));
        if (patch.insert) sendInput(applyModifiers(patch.insert));
        compositionText = next;
      }

      // Android WebView can report an entire `adb input text` operation as a
      // stream of keyCode 229 events. xterm's delayed textarea diff then sees
      // overlapping values and emits duplicated fragments (pri-ri-int...). Let
      // beforeinput/composition below own only those IME events; normal hardware
      // key events still follow xterm's proven VT key mapping.
      term.attachCustomKeyEventHandler((event) => {
        if (
          event.type === 'keydown' &&
          (event.keyCode === 229 || event.which === 229 || event.key === 'Unidentified')
        ) {
          return false;
        }
        return true;
      });

      // Capture composition before xterm's listeners. Reconcile incremental
      // text so Gboard/autocorrect can replace a composing suffix without ever
      // sending the same prefix twice.
      ta.addEventListener('compositionstart', (e) => {
        composing = true;
        compositionText = '';
        ta.value = '';
        e.stopImmediatePropagation();
      }, true);
      ta.addEventListener('compositionupdate', (e) => {
        reconcileComposition(e.data || '');
        e.stopImmediatePropagation();
      }, true);
      ta.addEventListener('compositionend', (e) => {
        reconcileComposition(e.data || compositionText);
        composing = false;
        compositionText = '';
        ta.value = '';
        e.stopImmediatePropagation();
      }, true);

      ta.addEventListener('beforeinput', (e) => {
        const t = e.inputType;
        let data = null;

        if (t === 'insertText' || t === 'insertReplacementText') {
          data = e.data || '';
        } else if (t === 'insertCompositionText' || t === 'insertFromComposition') {
          stopNativeEdit(e);
          if (!composing) composing = true;
          reconcileComposition(e.data || compositionText);
          if (t === 'insertFromComposition') composing = false;
          ta.value = '';
          return;
        } else if (t === 'deleteCompositionText') {
          stopNativeEdit(e);
          reconcileComposition('');
          ta.value = '';
          return;
        } else if (t === 'deleteContentBackward') {
          data = '\x7f';
        } else if (t === 'deleteContentForward') {
          data = '\x1b[3~';
        } else if (t === 'deleteWordBackward') {
          data = '\x17';
        } else if (t === 'insertLineBreak' || t === 'insertParagraph') {
          data = '\r';
        }

        if (data !== null) {
          stopNativeEdit(e);
          if (data && !isMirroredXtermInput(data, Date.now())) {
            sendInput(applyModifiers(data));
          }
          ta.value = '';
        }
      }, true);
    }
    hardenAndroidInput();

    term.onData((data) => {
      lastXtermInput = data;
      lastXtermInputAt = Date.now();
      sendInput(applyModifiers(data));
    });
    term.onResize(function () { /* fit posts resize; avoid double-fire */ });

    function copyToNative(text) {
      if (!text) return;
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'copyText', text: text }));
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'copied', length: text.length }));
      try { term.clearSelection(); } catch (e) {}
    }

    function getBufferText() {
      try {
        const buf = term.buffer.active;
        const logicalLines = [];
        let logicalLine = null;
        for (let i = 0; i < buf.length; i++) {
          const line = buf.getLine(i);
          if (!line) continue;
          const text = line.translateToString(true);

          // isWrapped belongs to the current physical row: it means this row
          // continues the preceding logical line. Join only those soft wraps;
          // every ordinary PTY newline remains a newline in the clipboard.
          if (line.isWrapped && logicalLine !== null) {
            logicalLine += text;
          } else {
            if (logicalLine !== null) logicalLines.push(logicalLine);
            logicalLine = text;
          }
        }
        if (logicalLine !== null) logicalLines.push(logicalLine);

        // The active buffer includes unused viewport rows after the cursor.
        // Remove those synthetic rows without removing intentional blank lines
        // in the middle of command output.
        while (logicalLines.length > 0 && logicalLines[logicalLines.length - 1] === '') {
          logicalLines.pop();
        }
        return logicalLines.join('\n');
      } catch (e) {
        return '';
      }
    }

    function handleCopyCommand() {
      const sel = term.getSelection();
      if (sel && sel.length > 0) {
        copyToNative(sel);
      } else {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'openSelectionModal',
          bufferText: getBufferText()
        }));
      }
    }

    function requestPasteFromNative() {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'requestPaste' }));
    }

    function clearInteractionState() {
      ctrlArmed = false;
      altArmed = false;
      notifyModifier();
      try { term.clearSelection(); } catch (e) {}
    }

    // CSI 3 J is the standard "erase saved lines" sequence. Keep ADEV's JS
    // replay buffer synchronized whenever a local or remote shell emits it.
    try {
      term.parser.registerCsiHandler({ final: 'J' }, function (params) {
        const values = params && typeof params.toArray === 'function'
          ? params.toArray()
          : params;
        if (Number(values && values[0]) === 3) {
          cancelFullClearTimer();
          awaitingClearSequence = false;
          pendingFullClear = false;
          clearSequenceProbe = '';
          clearInteractionState();
          notifyBufferCleared();
        }
        return false;
      });
    } catch (e) {}

    // Batch small native output chunks into one xterm write. More importantly,
    // only follow output while the user is already at the bottom; reading old
    // build logs must not snap back to the prompt on every new byte.
    let queuedOutput = [];
    let outputFlushScheduled = false;
    let followQueuedOutput = true;
    function queueOutput(data) {
      if (!data) return;
      if (awaitingClearSequence) {
        clearSequenceProbe = (clearSequenceProbe + data).slice(-96);
        // BusyBox, ncurses and remote shells vary between CSI J and CSI 2 J.
        // Only promote it to a full local clear after the user submitted the
        // exact `clear` command; ordinary full-screen redraws keep history.
        if (/\x1b\[[0-9;?]*J/.test(clearSequenceProbe) || /\x1bc/.test(clearSequenceProbe)) {
          awaitingClearSequence = false;
          pendingFullClear = true;
        }
      }
      if (queuedOutput.length === 0) {
        try {
          const buffer = term.buffer.active;
          followQueuedOutput = buffer.viewportY >= buffer.baseY - 1;
        } catch (e) {
          followQueuedOutput = true;
        }
      }
      queuedOutput.push(data);
      if (outputFlushScheduled) return;
      outputFlushScheduled = true;
      requestAnimationFrame(function () {
        outputFlushScheduled = false;
        const output = queuedOutput.join('');
        queuedOutput = [];
        const shouldFollow = followQueuedOutput;
        term.write(output, function () {
          if (shouldFollow) {
            try { term.scrollToBottom(); } catch (e) {}
          }
          scheduleFullClear();
        });
      });
    }

    document.addEventListener('message', (event) => { handleMessage(event.data); });
    window.addEventListener('message', (event) => { handleMessage(event.data); });

    function handleMessage(data) {
      try {
        const message = JSON.parse(data);
        switch (message.type) {
          case 'output':
            queueOutput(message.data);
            break;
          case 'clearScreen':
            clearInteractionState();
            // Erase the visible display locally. The PTY and its foreground
            // process keep running, and older scrollback remains reachable.
            term.write('\x1b[2J\x1b[H');
            break;
          case 'clear':
          case 'clearScrollback':
            finishFullClear();
            break;
          case 'resize':
            if (message.cols && message.rows) {
              try { term.resize(message.cols, message.rows); } catch (e) {}
            }
            break;
          case 'fit': scheduleFit(); break;
          case 'theme': term.options.theme = message.theme; break;
          case 'fontSize':
            term.options.fontSize = clampFontSize(message.size);
            saveFontSize(term.options.fontSize);
            scheduleFit();
            break;
          case 'focus': term.focus(); scheduleFit(); break;
          case 'blur': term.blur(); break;
          case 'selectAll': term.selectAll(); break;
          case 'openSelectModal':
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'openSelectionModal',
              bufferText: getBufferText()
            }));
            break;
          case 'key': sendInput(message.data); break;
          case 'armCtrl': ctrlArmed = !ctrlArmed; notifyModifier(); term.focus(); break;
          case 'armAlt': altArmed = !altArmed; notifyModifier(); term.focus(); break;
          case 'clearModifiers': clearInteractionState(); break;
          case 'clearSelection': try { term.clearSelection(); } catch (e) {} break;
          case 'copy': handleCopyCommand(); break;
          case 'requestPasteFromNative': requestPasteFromNative(); break;
          case 'pasteText':
            if (message.data) sendInput(message.data);
            break;
          case 'paste': requestPasteFromNative(); break;
          case 'getSelection':
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'selection', data: term.getSelection()
            }));
            break;
        }
      } catch (e) { console.error('Error handling message:', e); }
    }

    window.ReactNativeWebView.postMessage(JSON.stringify({
      type: 'ready', cols: term.cols, rows: term.rows, fontSize: term.options.fontSize
    }));

    const terminalElement = document.getElementById('terminal');

    // --- Hold-to-copy ----------------------------------------------------------
    // Copying must be deliberate: the Copy chip only appears after a full
    // hold ON TOP OF an existing xterm selection. A long-press without a
    // selection stays a plain scroll/pan hold — no vibration, no copy UI.
    const HOLD_COPY_DELAY_MS = 600;
    const HOLD_COPY_MOVE_CANCEL_PX_SQ = 100; // >10px of travel cancels the pending hold
    const HOLD_COPY_FLASH_MS = 180;
    const HOLD_COPY_SELECTION_BASE = '#264f78'; // selectionBackground in the theme above
    let longPressTimer = null;
    let longPressX = 0;
    let longPressY = 0;
    let holdCopyFlashTimer = null;

    const holdCopyBar = document.createElement('button');
    holdCopyBar.id = 'hold-copy-bar';
    holdCopyBar.textContent = 'Copy';
    document.body.appendChild(holdCopyBar);

    function cancelLongPress() {
      if (longPressTimer !== null) clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    function hideHoldCopyBar() {
      holdCopyBar.style.display = 'none';
    }

    function showHoldCopyBar() {
      // The selection can vanish while the flash runs; re-check before showing.
      try { if (!term.getSelection()) return; } catch (e) {}
      holdCopyBar.style.display = 'block';
    }

    // Haptic-free feedback: briefly brighten the selection highlight so the
    // hold is acknowledged without any UI appearing first.
    function flashSelectionThen(showFn) {
      if (holdCopyFlashTimer !== null) clearTimeout(holdCopyFlashTimer);
      try {
        term.options.theme = Object.assign({}, term.options.theme, {
          selectionBackground: '#4ec9b0'
        });
      } catch (e) {}
      holdCopyFlashTimer = setTimeout(function () {
        holdCopyFlashTimer = null;
        try {
          term.options.theme = Object.assign({}, term.options.theme, {
            selectionBackground: HOLD_COPY_SELECTION_BASE
          });
        } catch (e) {}
        showFn();
      }, HOLD_COPY_FLASH_MS);
    }

    holdCopyBar.addEventListener('click', function () {
      hideHoldCopyBar();
      let selected = '';
      try { selected = term.getSelection(); } catch (e) {}
      if (selected) copyToNative(selected);
    });

    // Auto-dismiss whenever the selection goes away — explicit clear messages,
    // copyToNative's clearSelection and the clear/CSI paths all land here.
    term.onSelectionChange(function (selection) {
      if (!selection) hideHoldCopyBar();
    });

    terminalElement.addEventListener('touchstart', (event) => {
      term.focus();
      scheduleFit();
      hideHoldCopyBar(); // any new tap dismisses the chip
      cancelLongPress();
      const touch = event.touches && event.touches[0];
      if (!touch || !event.touches || event.touches.length !== 1) return;
      longPressX = touch.clientX;
      longPressY = touch.clientY;
      longPressTimer = setTimeout(function () {
        longPressTimer = null;
        let selected = '';
        try { selected = term.getSelection(); } catch (e) {}
        // No live selection: plain long-press, identical to resting a finger.
        // Never vibrate and never open copy UI from here.
        if (!selected) return;
        flashSelectionThen(showHoldCopyBar);
      }, HOLD_COPY_DELAY_MS);
    }, { passive: true });
    terminalElement.addEventListener('touchmove', (event) => {
      const touch = event.touches && event.touches[0];
      if (!touch) return cancelLongPress();
      const dx = touch.clientX - longPressX;
      const dy = touch.clientY - longPressY;
      if (dx * dx + dy * dy > HOLD_COPY_MOVE_CANCEL_PX_SQ) cancelLongPress();
    }, { passive: true });
    terminalElement.addEventListener('touchend', cancelLongPress, { passive: true });
    terminalElement.addEventListener('touchcancel', cancelLongPress, { passive: true });
  </script>
</body>
</html>
