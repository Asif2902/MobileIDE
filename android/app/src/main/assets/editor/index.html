<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MobileIDE Editor</title>
  <link rel="stylesheet" href="./vs/editor/editor.main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #1e1e1e;
      /* Help Android WebView focus the hidden textarea */
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
    #editor { width: 100%; height: 100%; position: relative; }
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #888; font-family: sans-serif;
    }
    /* Monaco input textarea must accept touches for the soft keyboard */
    .monaco-editor .inputarea {
      position: absolute !important;
      opacity: 0.01 !important;
      z-index: 10 !important;
      /* Keep a non-zero hit target on Android WebView */
      min-width: 1px !important;
      min-height: 1px !important;
    }
  </style>
</head>
<body>
  <div id="editor"><div class="loading">Loading Editor...</div></div>

  <script>
    var ASSET_BASE = 'file:///android_asset/editor/';

    function createStubWorker() {
      var listeners = { message: [], error: [] };
      return {
        postMessage: function () {},
        terminate: function () {},
        addEventListener: function (type, fn) {
          if (listeners[type]) listeners[type].push(fn);
        },
        removeEventListener: function (type, fn) {
          if (!listeners[type]) return;
          listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
        },
        dispatchEvent: function () { return true; },
        onmessage: null,
        onerror: null
      };
    }

    self.MonacoEnvironment = {
      baseUrl: ASSET_BASE,
      getWorker: function () { return createStubWorker(); },
      getWorkerUrl: function () {
        var code = '/* monaco worker stub */ self.onmessage = function(){};';
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(code);
      }
    };
  </script>
  <script src="./loader.min.js"></script>
  <script>
    var editor = null;
    var currentModel = null;
    var currentPath = '';
    var models = new Map();
    var fatalReported = false;
    var applyingExternalEdit = false;

    function postRN(payload) {
      try {
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      } catch (e) {}
    }

    function reportFatal(where, err) {
      if (editor || fatalReported) {
        try { postRN({ type: 'warn', where: where, message: stringifyErr(err) }); } catch (e) {}
        return;
      }
      fatalReported = true;
      postRN({ type: 'fatal', where: where, message: stringifyErr(err) });
    }

    function stringifyErr(err) {
      if (err == null) return 'unknown';
      if (typeof err === 'string') return err;
      if (err.message || err.stack) {
        return (err.message || '') + (err.stack ? (' | stack: ' + err.stack) : '');
      }
      if (err.target && (err.target.src || err.target.href)) {
        return 'resource-fail: ' + (err.target.src || err.target.href);
      }
      var parts = [];
      if (err.type) parts.push('type=' + err.type);
      if (err.filename) parts.push('file=' + err.filename + ':' + err.lineno + ':' + err.colno);
      if (err.reason) parts.push('reason=' + (err.reason && err.reason.message ? err.reason.message : err.reason));
      return parts.length ? parts.join(' ') : Object.prototype.toString.call(err);
    }

    window.onerror = function (message, source, lineno, colno, error) {
      var msgStr = typeof message === 'string' ? message : '';
      if (editor) return true;
      if (msgStr.indexOf('[object Event]') !== -1 && !error) return true;
      reportFatal('onerror', msgStr || error || message);
      return true;
    };
    window.addEventListener('error', function (e) {
      var el = e && e.target;
      if (el && (el.src || el.href)) {
        postRN({ type: 'warn', where: 'resource', message: 'Failed to load: ' + (el.src || el.href) });
        e.preventDefault && e.preventDefault();
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (editor) {
        postRN({ type: 'warn', where: 'unhandledrejection', message: stringifyErr(e && e.reason) });
        return;
      }
      reportFatal('unhandledrejection', e && e.reason);
    });

    require.config({
      paths: { vs: './vs' },
      'vs/nls': { availableLanguages: { '*': '' } }
    });
    if (typeof require !== 'undefined' && require.config) {
      require.config({
        onError: function (err) { reportFatal('amd', err && (err.message || err)); }
      });
    }

    /** Force soft keyboard: focus Monaco + its hidden textarea. */
    function forceKeyboardFocus() {
      if (!editor) return;
      try {
        editor.focus();
        var ta = document.querySelector('.monaco-editor .inputarea');
        if (ta) {
          ta.setAttribute('inputmode', 'text');
          ta.setAttribute('enterkeyhint', 'enter');
          ta.setAttribute('autocapitalize', 'off');
          ta.setAttribute('autocomplete', 'off');
          ta.setAttribute('autocorrect', 'off');
          ta.setAttribute('spellcheck', 'false');
          // Android WebView often needs a real user-gesture focus on the textarea
          ta.focus();
          try {
            var len = (ta.value && ta.value.length) || 0;
            ta.setSelectionRange(len, len);
          } catch (e) {}
        }
      } catch (e) {}
    }

    function wireMobileFocus(host) {
      // Capture-phase touch so we beat Monaco's default handling when WebView is sticky
      var openKb = function (ev) {
        // Don't preventDefault — Monaco needs the event for caret placement
        setTimeout(forceKeyboardFocus, 0);
        setTimeout(forceKeyboardFocus, 50);
      };
      host.addEventListener('touchend', openKb, { passive: true });
      host.addEventListener('click', openKb, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (host.contains(e.target)) openKb(e);
      }, { passive: true });
    }

    require(['vs/editor/editor.main'], function () {
      try {
        if (monaco.languages && monaco.languages.typescript) {
          var ts = monaco.languages.typescript;
          var soft = {
            noSemanticValidation: true,
            noSyntaxValidation: true,
            noSuggestionDiagnostics: true
          };
          try {
            ts.typescriptDefaults.setDiagnosticsOptions(soft);
            ts.javascriptDefaults.setDiagnosticsOptions(soft);
            ts.typescriptDefaults.setEagerModelSync(false);
            ts.javascriptDefaults.setEagerModelSync(false);
          } catch (e) {}
        }

        monaco.editor.defineTheme('mobileide-dark', {
          base: 'vs-dark',
          inherit: true,
          rules: [
            { token: 'comment', foreground: '6A9955' },
            { token: 'keyword', foreground: '569CD6' },
            { token: 'string', foreground: 'CE9178' },
            { token: 'number', foreground: 'B5CEA8' },
            { token: 'type', foreground: '4EC9B0' },
            { token: 'function', foreground: 'DCDCAA' },
            { token: 'variable', foreground: '9CDCFE' }
          ],
          colors: {
            'editor.background': '#1e1e1e',
            'editor.foreground': '#d4d4d4',
            'editor.lineHighlightBackground': '#2a2d2e',
            'editor.selectionBackground': '#264f78',
            'editorCursor.foreground': '#d4d4d4',
            'editorLineNumber.foreground': '#858585',
            'editorLineNumber.activeForeground': '#c6c6c6'
          }
        });

        monaco.editor.defineTheme('mobileide-light', {
          base: 'vs',
          inherit: true,
          rules: [],
          colors: { 'editor.background': '#ffffff', 'editor.foreground': '#000000' }
        });

        var host = document.getElementById('editor');
        host.innerHTML = '';

        editor = monaco.editor.create(host, {
          value: '',
          language: 'javascript',
          theme: 'mobileide-dark',
          automaticLayout: true,
          minimap: { enabled: false },
          wordWrap: 'on',
          wrappingStrategy: 'advanced',
          lineNumbersMinChars: 3,
          glyphMargin: false,
          fontSize: 14,
          lineHeight: 22,
          tabSize: 2,
          scrollBeyondLastLine: true,
          renderWhitespace: 'none',
          cursorBlinking: 'blink',
          smoothScrolling: false,
          contextmenu: false,
          // Mobile: keep suggestions light so the keyboard stays usable
          quickSuggestions: false,
          suggestOnTriggerCharacters: false,
          acceptSuggestionOnEnter: 'off',
          tabCompletion: 'off',
          parameterHints: { enabled: false },
          hover: { enabled: false },
          formatOnPaste: false,
          formatOnType: false,
          autoClosingBrackets: 'languageDefined',
          autoClosingQuotes: 'languageDefined',
          folding: false,
          matchBrackets: 'near',
          autoIndent: 'advanced',
          stickyScroll: { enabled: false },
          padding: { top: 8, bottom: 48 },
          links: false,
          colorDecorators: false,
          readOnly: false,
          domReadOnly: false,
          // Important for mobile caret/keyboard
          accessibilitySupport: 'off',
          mouseWheelZoom: false,
          // Extra bottom space so last lines aren't under the soft keyboard
          scrollbar: {
            verticalScrollbarSize: 10,
            horizontalScrollbarSize: 10,
            alwaysConsumeMouseWheel: false
          }
        });

        editor.onDidChangeModelContent(function () {
          if (applyingExternalEdit) return;
          postRN({ type: 'change', content: editor.getValue(), path: currentPath });
        });

        editor.onDidChangeCursorPosition(function (e) {
          postRN({
            type: 'cursor',
            line: e.position.lineNumber,
            column: e.position.column
          });
        });

        // Ctrl/Cmd+S from hardware keyboard
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
          postRN({ type: 'saveRequest', path: currentPath, content: editor.getValue() });
        });

        wireMobileFocus(host);
        // Layout after create — zero-size layout kills input on some WebViews
        setTimeout(function () {
          try { editor.layout(); } catch (e) {}
          forceKeyboardFocus();
        }, 100);

        postRN({ type: 'ready' });
      } catch (e) {
        reportFatal('create', e);
      }
    }, function (err) {
      reportFatal('require', err);
    });

    document.addEventListener('message', function (event) { handleMessage(event.data); });
    window.addEventListener('message', function (event) { handleMessage(event.data); });

    function handleMessage(data) {
      try {
        var message = JSON.parse(data);
        switch (message.type) {
          case 'openFile':
            openFile(message.path, message.content, message.language);
            break;
          case 'setContent':
            if (editor) {
              applyingExternalEdit = true;
              try { editor.setValue(message.content || ''); } finally { applyingExternalEdit = false; }
            }
            break;
          case 'getContent':
            if (editor) postRN({ type: 'content', content: editor.getValue(), path: currentPath });
            break;
          case 'setTheme':
            if (editor) {
              monaco.editor.setTheme(message.theme === 'dark' ? 'mobileide-dark' : 'mobileide-light');
            }
            break;
          case 'setFontSize':
            if (editor) editor.updateOptions({ fontSize: message.size });
            break;
          case 'setWordWrap':
            if (editor) editor.updateOptions({ wordWrap: message.enabled ? 'on' : 'off' });
            break;
          case 'setTabSize':
            if (editor) editor.updateOptions({ tabSize: message.size });
            break;
          case 'format':
            if (editor) {
              var act = editor.getAction('editor.action.formatDocument');
              if (act) act.run();
            }
            break;
          case 'undo':
            if (editor) editor.trigger('keyboard', 'undo', null);
            break;
          case 'redo':
            if (editor) editor.trigger('keyboard', 'redo', null);
            break;
          case 'find':
            if (editor) {
              var find = editor.getAction('actions.find');
              if (find) find.run();
            }
            break;
          case 'goToLine':
            if (editor) {
              editor.revealLineInCenter(message.line);
              editor.setPosition({ lineNumber: message.line, column: 1 });
            }
            break;
          case 'focus':
            forceKeyboardFocus();
            break;
          case 'blur':
            if (editor) {
              try {
                var ta = document.querySelector('.monaco-editor .inputarea');
                if (ta) ta.blur();
              } catch (e) {}
            }
            break;
          case 'layout':
            if (editor) {
              try { editor.layout(); } catch (e) {}
            }
            break;
          case 'copy':
            if (editor) {
              var sel = editor.getModel().getValueInRange(editor.getSelection());
              postRN({ type: 'copyText', text: sel || editor.getValue() });
            }
            break;
        }
      } catch (e) {
        console.error('Error handling message:', e);
      }
    }

    function openFile(path, content, language) {
      if (!editor) return;
      currentPath = path || '';
      var lang = language || 'plaintext';
      var uri = monaco.Uri.parse('inmemory://model/' + encodeURIComponent(path || 'untitled'));
      var model = models.get(path);
      applyingExternalEdit = true;
      try {
        if (model) {
          // content === null means "keep buffer" (same file, path already open).
          // Only setValue when RN sends a real string (file switch / external reload).
          if (content !== null && content !== undefined && typeof content === 'string') {
            if (model.getValue() !== content) {
              model.setValue(content);
            }
          }
          if (model.getLanguageId() !== lang) {
            monaco.editor.setModelLanguage(model, lang);
          }
        } else {
          model = monaco.editor.createModel(
            (content !== null && content !== undefined) ? content : '',
            lang,
            uri
          );
          models.set(path, model);
        }
        editor.setModel(model);
        currentModel = model;
      } finally {
        applyingExternalEdit = false;
      }
      postRN({ type: 'fileOpened', path: path });
      setTimeout(forceKeyboardFocus, 30);
      setTimeout(function () { try { editor.layout(); } catch (e) {} }, 60);
    }

    // Visual viewport changes (keyboard show/hide) — re-layout Monaco
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        if (editor) {
          try { editor.layout(); } catch (e) {}
        }
      });
    }
    window.addEventListener('resize', function () {
      if (editor) {
        try { editor.layout(); } catch (e) {}
      }
    });
  </script>
</body>
</html>
