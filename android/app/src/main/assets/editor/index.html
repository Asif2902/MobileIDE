<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MobileIDE Editor</title>
  <link rel="stylesheet" href="./vs/editor/editor.main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #1e1e1e;
      /* Help Android WebView focus the hidden textarea */
      -webkit-user-select: text;
      user-select: text;
      touch-action: pan-x pan-y;
    }
    #editor { width: 100%; height: 100%; position: relative; }
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #888; font-family: sans-serif;
    }
    /*
     * Android soft keyboard: WebView ignores focus on 1×1 / fully-invisible
     * textareas. Give Monaco's .inputarea a real hit target + 16px font
     * (Android skips the keyboard for <16px inputs to "prevent zoom").
     */
    .monaco-editor .inputarea,
    .monaco-editor textarea.inputarea {
      opacity: 0.02 !important;
      z-index: 50 !important;
      min-width: 2px !important;
      min-height: 22px !important;
      font-size: 16px !important;
      line-height: 22px !important;
      -webkit-user-select: text !important;
      user-select: text !important;
      pointer-events: auto !important;
      caret-color: #d4d4d4 !important;
      color: transparent !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
    }
    .monaco-editor, .monaco-editor .overflow-guard, .monaco-editor .monaco-scrollable-element {
      -webkit-user-select: none;
      user-select: none;
    }
    #mobile-edit-tools {
      display: none;
      position: fixed;
      z-index: 1002;
      height: 42px;
      align-items: center;
      gap: 2px;
      max-width: calc(100vw - 16px);
      padding: 4px;
      border: 1px solid #4b4b53;
      border-radius: 8px;
      background: #2b2b30;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .45);
      overflow-x: auto;
      white-space: nowrap;
    }
    #mobile-edit-tools.visible { display: flex; }
    #mobile-edit-tools button {
      height: 32px;
      padding: 0 9px;
      border: 0;
      border-radius: 5px;
      color: #e4e4e7;
      background: transparent;
      font: 600 12px sans-serif;
    }
    #mobile-edit-tools button:active { background: #45404f; color: #c4b5fd; }
    .mobile-selection-handle {
      display: none;
      position: fixed;
      z-index: 1001;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      border: 3px solid #1e1e1e;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .65);
      touch-action: none;
    }
    .mobile-selection-handle.visible { display: block; }
    .mobile-selection-handle.start { transform: translateY(-2px); }
    .mobile-selection-handle.end { transform: translateY(2px); }
    @media (max-width: 420px) {
      #mobile-edit-tools button { padding: 0 7px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="editor"><div class="loading">Loading Editor...</div></div>
  <div id="mobile-edit-tools" role="toolbar" aria-label="Text selection actions">
    <button type="button" data-edit-action="copy">Copy</button>
    <button type="button" data-edit-action="cut">Cut</button>
    <button type="button" data-edit-action="paste">Paste</button>
    <button type="button" data-edit-action="selectAll">Select all</button>
    <button type="button" data-edit-action="delete">Delete</button>
  </div>
  <div id="selection-handle-start" class="mobile-selection-handle start" aria-hidden="true"></div>
  <div id="selection-handle-end" class="mobile-selection-handle end" aria-hidden="true"></div>

  <script>
    var ASSET_BASE = 'file:///android_asset/editor/';

    function createStubWorker() {
      var listeners = { message: [], error: [] };
      return {
        postMessage: function () {},
        terminate: function () {},
        addEventListener: function (type, fn) {
          if (listeners[type]) listeners[type].push(fn);
        },
        removeEventListener: function (type, fn) {
          if (!listeners[type]) return;
          listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
        },
        dispatchEvent: function () { return true; },
        onmessage: null,
        onerror: null
      };
    }

    self.MonacoEnvironment = {
      baseUrl: ASSET_BASE,
      getWorker: function () { return createStubWorker(); },
      getWorkerUrl: function () {
        var code = '/* monaco worker stub */ self.onmessage = function(){};';
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(code);
      }
    };
  </script>
  <script src="./loader.min.js"></script>
  <script>
    var editor = null;
    var currentModel = null;
    var currentPath = '';
    var models = new Map();
    var fatalReported = false;
    var applyingExternalEdit = false;
    var mobileSelectionActive = false;
    var longPressTimer = null;
    var longPressTriggered = false;
    var touchStartPoint = null;
    var currentFontSize = 14;
    var pinchStartDistance = 0;
    var pinchStartFontSize = 14;
    var searchState = { query: '', matches: [], index: -1 };

    function postRN(payload) {
      try {
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      } catch (e) {}
    }

    function reportFatal(where, err) {
      if (editor || fatalReported) {
        try { postRN({ type: 'warn', where: where, message: stringifyErr(err) }); } catch (e) {}
        return;
      }
      fatalReported = true;
      postRN({ type: 'fatal', where: where, message: stringifyErr(err) });
    }

    function stringifyErr(err) {
      if (err == null) return 'unknown';
      if (typeof err === 'string') return err;
      if (err.message || err.stack) {
        return (err.message || '') + (err.stack ? (' | stack: ' + err.stack) : '');
      }
      if (err.target && (err.target.src || err.target.href)) {
        return 'resource-fail: ' + (err.target.src || err.target.href);
      }
      var parts = [];
      if (err.type) parts.push('type=' + err.type);
      if (err.filename) parts.push('file=' + err.filename + ':' + err.lineno + ':' + err.colno);
      if (err.reason) parts.push('reason=' + (err.reason && err.reason.message ? err.reason.message : err.reason));
      return parts.length ? parts.join(' ') : Object.prototype.toString.call(err);
    }

    window.onerror = function (message, source, lineno, colno, error) {
      var msgStr = typeof message === 'string' ? message : '';
      if (editor) return true;
      if (msgStr.indexOf('[object Event]') !== -1 && !error) return true;
      reportFatal('onerror', msgStr || error || message);
      return true;
    };
    window.addEventListener('error', function (e) {
      var el = e && e.target;
      if (el && (el.src || el.href)) {
        postRN({ type: 'warn', where: 'resource', message: 'Failed to load: ' + (el.src || el.href) });
        e.preventDefault && e.preventDefault();
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (editor) {
        postRN({ type: 'warn', where: 'unhandledrejection', message: stringifyErr(e && e.reason) });
        return;
      }
      reportFatal('unhandledrejection', e && e.reason);
    });

    require.config({
      paths: { vs: './vs' },
      'vs/nls': { availableLanguages: { '*': '' } }
    });
    if (typeof require !== 'undefined' && require.config) {
      require.config({
        onError: function (err) { reportFatal('amd', err && (err.message || err)); }
      });
    }

    /** Force soft keyboard: focus Monaco + its hidden textarea (sync when possible). */
    function forceKeyboardFocus() {
      if (!editor) return;
      try {
        editor.focus();
        var ta =
          document.querySelector('textarea.inputarea') ||
          document.querySelector('.monaco-editor textarea') ||
          document.querySelector('.monaco-editor .inputarea');
        if (ta) {
          ta.removeAttribute('readonly');
          ta.removeAttribute('disabled');
          ta.setAttribute('inputmode', 'text');
          ta.setAttribute('enterkeyhint', 'enter');
          ta.setAttribute('autocapitalize', 'off');
          ta.setAttribute('autocomplete', 'off');
          ta.setAttribute('autocorrect', 'off');
          ta.setAttribute('spellcheck', 'false');
          ta.style.fontSize = '16px';
          ta.style.minHeight = '22px';
          ta.style.opacity = '0.02';
          // Must run inside the user gesture when possible (touchstart).
          ta.focus({ preventScroll: true });
          try { ta.click(); } catch (e2) {}
          try {
            var len = (ta.value && ta.value.length) || 0;
            if (len > 0) ta.setSelectionRange(len, len);
          } catch (e3) {}
        }
      } catch (e) {}
    }

    function distance(a, b) {
      var dx = a.clientX - b.clientX;
      var dy = a.clientY - b.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function clearLongPress() {
      if (longPressTimer) clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    function positionAtPoint(clientX, clientY) {
      if (!editor) return null;
      try {
        var target = editor.getTargetAtClientPoint(clientX, clientY);
        if (target && target.position) return target.position;
      } catch (e) {}
      return editor.getPosition();
    }

    function hideMobileSelection() {
      mobileSelectionActive = false;
      document.getElementById('mobile-edit-tools').classList.remove('visible');
      document.getElementById('selection-handle-start').classList.remove('visible');
      document.getElementById('selection-handle-end').classList.remove('visible');
    }

    function updateMobileSelection() {
      if (!editor || !mobileSelectionActive) return;
      var selection = editor.getSelection();
      if (!selection || selection.isEmpty()) {
        hideMobileSelection();
        return;
      }
      var start = editor.getScrolledVisiblePosition(selection.getStartPosition());
      var end = editor.getScrolledVisiblePosition(selection.getEndPosition());
      if (!start || !end) {
        hideMobileSelection();
        return;
      }
      var hostRect = document.getElementById('editor').getBoundingClientRect();
      var startHandle = document.getElementById('selection-handle-start');
      var endHandle = document.getElementById('selection-handle-end');
      startHandle.style.left = (hostRect.left + start.left) + 'px';
      startHandle.style.top = (hostRect.top + start.top + start.height - 4) + 'px';
      endHandle.style.left = (hostRect.left + end.left) + 'px';
      endHandle.style.top = (hostRect.top + end.top + end.height - 4) + 'px';
      startHandle.classList.add('visible');
      endHandle.classList.add('visible');

      var tools = document.getElementById('mobile-edit-tools');
      tools.classList.add('visible');
      var desiredLeft = hostRect.left + Math.min(start.left, end.left);
      var desiredTop = hostRect.top + Math.min(start.top, end.top) - 50;
      tools.style.left = Math.max(8, Math.min(window.innerWidth - tools.offsetWidth - 8, desiredLeft)) + 'px';
      tools.style.top = Math.max(8, desiredTop) + 'px';
    }

    function selectWordAt(clientX, clientY) {
      if (!editor || !editor.getModel()) return;
      var position = positionAtPoint(clientX, clientY);
      if (!position) return;
      var model = editor.getModel();
      var word = model.getWordAtPosition(position);
      var endColumn = word ? word.endColumn : Math.min(model.getLineMaxColumn(position.lineNumber), position.column + 1);
      var startColumn = word ? word.startColumn : position.column;
      editor.setSelection(new monaco.Selection(
        position.lineNumber,
        startColumn,
        position.lineNumber,
        endColumn
      ));
      editor.revealPositionInCenterIfOutsideViewport(position);
      mobileSelectionActive = true;
      updateMobileSelection();
    }

    function wireSelectionHandle(handle, which) {
      handle.addEventListener('touchstart', function (event) {
        event.preventDefault();
        event.stopPropagation();
        var original = editor && editor.getSelection();
        if (!original) return;
        var fixed = which === 'start' ? original.getEndPosition() : original.getStartPosition();
        var move = function (moveEvent) {
          if (!moveEvent.touches.length) return;
          moveEvent.preventDefault();
          var point = moveEvent.touches[0];
          var position = positionAtPoint(point.clientX, point.clientY);
          if (!position) return;
          editor.setSelection(which === 'start'
            ? new monaco.Selection(position.lineNumber, position.column, fixed.lineNumber, fixed.column)
            : new monaco.Selection(fixed.lineNumber, fixed.column, position.lineNumber, position.column));
          updateMobileSelection();
        };
        var end = function () {
          window.removeEventListener('touchmove', move);
          window.removeEventListener('touchend', end);
          updateMobileSelection();
        };
        window.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', end, { passive: true });
      }, { passive: false });
    }

    function selectedText() {
      if (!editor || !editor.getModel()) return '';
      return editor.getModel().getValueInRange(editor.getSelection());
    }

    function replaceSelection(text, source) {
      if (!editor || !editor.getModel()) return;
      var range = editor.getSelection();
      editor.pushUndoStop();
      editor.executeEdits(source || 'mobile-edit', [{ range: range, text: text || '', forceMoveMarkers: true }]);
      editor.pushUndoStop();
      hideMobileSelection();
      forceKeyboardFocus();
    }

    function handleMobileEditAction(action) {
      if (!editor || !editor.getModel()) return;
      var model = editor.getModel();
      var selection = editor.getSelection();
      if (action === 'copy') {
        postRN({ type: 'copyText', text: selectedText() });
      } else if (action === 'cut') {
        postRN({ type: 'copyText', text: selectedText() });
        replaceSelection('', 'mobile-cut');
      } else if (action === 'paste') {
        postRN({ type: 'pasteRequest' });
      } else if (action === 'selectAll') {
        editor.setSelection(model.getFullModelRange());
        mobileSelectionActive = true;
        updateMobileSelection();
      } else if (action === 'delete' && selection && !selection.isEmpty()) {
        replaceSelection('', 'mobile-delete');
      }
    }

    function wireMobileEditing(host) {
      var begin = function (event) {
        if (!editor || !event.touches || !event.touches.length) return;
        if (event.touches.length === 2) {
          clearLongPress();
          pinchStartDistance = distance(event.touches[0], event.touches[1]);
          pinchStartFontSize = currentFontSize;
          return;
        }
        var point = event.touches[0];
        touchStartPoint = { x: point.clientX, y: point.clientY };
        longPressTriggered = false;
        clearLongPress();
        longPressTimer = setTimeout(function () {
          longPressTriggered = true;
          selectWordAt(touchStartPoint.x, touchStartPoint.y);
        }, 520);
      };
      var move = function (event) {
        if (event.touches && event.touches.length === 2 && pinchStartDistance > 0) {
          event.preventDefault();
          clearLongPress();
          var scale = distance(event.touches[0], event.touches[1]) / pinchStartDistance;
          var next = Math.max(8, Math.min(32, Math.round(pinchStartFontSize * scale)));
          if (next !== currentFontSize) {
            currentFontSize = next;
            editor.updateOptions({ fontSize: next, lineHeight: Math.round(next * 1.55) });
            postRN({ type: 'fontSizeChanged', size: next });
          }
          return;
        }
        if (!touchStartPoint || !event.touches || !event.touches.length) return;
        var point = event.touches[0];
        if (Math.abs(point.clientX - touchStartPoint.x) > 10 || Math.abs(point.clientY - touchStartPoint.y) > 10) {
          clearLongPress();
        }
      };
      var end = function () {
        clearLongPress();
        pinchStartDistance = 0;
        if (!longPressTriggered) {
          forceKeyboardFocus();
          setTimeout(forceKeyboardFocus, 40);
        }
        touchStartPoint = null;
      };
      host.addEventListener('touchstart', begin, { passive: true, capture: true });
      host.addEventListener('touchmove', move, { passive: false, capture: true });
      host.addEventListener('touchend', end, { passive: true, capture: true });
      host.addEventListener('click', function () {
        if (!longPressTriggered) forceKeyboardFocus();
      }, { passive: true, capture: true });

      document.querySelectorAll('[data-edit-action]').forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          handleMobileEditAction(button.getAttribute('data-edit-action'));
        });
      });
      wireSelectionHandle(document.getElementById('selection-handle-start'), 'start');
      wireSelectionHandle(document.getElementById('selection-handle-end'), 'end');
    }

    function findMatches(query) {
      if (!editor || !editor.getModel() || !query) return [];
      return editor.getModel().findMatches(query, false, false, false, null, true);
    }

    function reportSearch() {
      postRN({
        type: 'searchResult',
        query: searchState.query,
        current: searchState.index >= 0 ? searchState.index + 1 : 0,
        total: searchState.matches.length
      });
    }

    function runSearch(query, direction) {
      query = query || '';
      if (!editor || !query) {
        searchState = { query: query, matches: [], index: -1 };
        reportSearch();
        return;
      }
      var changed = searchState.query !== query;
      searchState.query = query;
      searchState.matches = findMatches(query);
      if (!searchState.matches.length) {
        searchState.index = -1;
        reportSearch();
        return;
      }
      if (changed || searchState.index < 0) {
        searchState.index = direction === 'previous' ? searchState.matches.length - 1 : 0;
      } else if (direction === 'previous') {
        searchState.index = (searchState.index - 1 + searchState.matches.length) % searchState.matches.length;
      } else {
        searchState.index = (searchState.index + 1) % searchState.matches.length;
      }
      var match = searchState.matches[searchState.index];
      editor.setSelection(match.range);
      editor.revealRangeInCenterIfOutsideViewport(match.range);
      reportSearch();
    }

    function replaceSearchMatch(query, replacement, all) {
      if (!editor || !query) return;
      var matches = findMatches(query);
      if (!matches.length) {
        searchState = { query: query, matches: [], index: -1 };
        reportSearch();
        return;
      }
      editor.pushUndoStop();
      if (all) {
        editor.executeEdits('search-replace-all', matches.map(function (match) {
          return { range: match.range, text: replacement || '', forceMoveMarkers: true };
        }));
      } else {
        var index = searchState.query === query && searchState.index >= 0 ? searchState.index : 0;
        var match = matches[Math.min(index, matches.length - 1)];
        editor.executeEdits('search-replace', [{
          range: match.range,
          text: replacement || '',
          forceMoveMarkers: true
        }]);
      }
      editor.pushUndoStop();
      searchState = { query: query, matches: findMatches(query), index: -1 };
      if (!all && searchState.matches.length) runSearch(query, 'next');
      else reportSearch();
    }

    require(['vs/editor/editor.main'], function () {
      try {
        if (monaco.languages && monaco.languages.typescript) {
          var ts = monaco.languages.typescript;
          var soft = {
            noSemanticValidation: true,
            noSyntaxValidation: true,
            noSuggestionDiagnostics: true
          };
          try {
            ts.typescriptDefaults.setDiagnosticsOptions(soft);
            ts.javascriptDefaults.setDiagnosticsOptions(soft);
            ts.typescriptDefaults.setEagerModelSync(false);
            ts.javascriptDefaults.setEagerModelSync(false);
          } catch (e) {}
        }

        monaco.editor.defineTheme('mobileide-dark', {
          base: 'vs-dark',
          inherit: true,
          rules: [
            { token: 'comment', foreground: '6A9955' },
            { token: 'keyword', foreground: '569CD6' },
            { token: 'string', foreground: 'CE9178' },
            { token: 'number', foreground: 'B5CEA8' },
            { token: 'type', foreground: '4EC9B0' },
            { token: 'function', foreground: 'DCDCAA' },
            { token: 'variable', foreground: '9CDCFE' }
          ],
          colors: {
            'editor.background': '#1e1e1e',
            'editor.foreground': '#d4d4d4',
            'editor.lineHighlightBackground': '#2a2d2e',
            'editor.selectionBackground': '#264f78',
            'editorCursor.foreground': '#d4d4d4',
            'editorLineNumber.foreground': '#858585',
            'editorLineNumber.activeForeground': '#c6c6c6'
          }
        });

        monaco.editor.defineTheme('mobileide-light', {
          base: 'vs',
          inherit: true,
          rules: [],
          colors: { 'editor.background': '#ffffff', 'editor.foreground': '#000000' }
        });

        var host = document.getElementById('editor');
        host.innerHTML = '';

        editor = monaco.editor.create(host, {
          value: '',
          language: 'javascript',
          theme: 'mobileide-dark',
          automaticLayout: true,
          minimap: { enabled: false },
          wordWrap: 'on',
          wrappingStrategy: 'advanced',
          lineNumbersMinChars: 3,
          glyphMargin: false,
          fontSize: 14,
          lineHeight: 22,
          tabSize: 2,
          scrollBeyondLastLine: true,
          renderWhitespace: 'none',
          cursorBlinking: 'blink',
          smoothScrolling: false,
          contextmenu: false,
          // Mobile: keep suggestions light so the keyboard stays usable
          quickSuggestions: false,
          suggestOnTriggerCharacters: false,
          acceptSuggestionOnEnter: 'off',
          tabCompletion: 'off',
          parameterHints: { enabled: false },
          hover: { enabled: false },
          formatOnPaste: false,
          formatOnType: false,
          autoClosingBrackets: 'languageDefined',
          autoClosingQuotes: 'languageDefined',
          folding: false,
          matchBrackets: 'near',
          autoIndent: 'advanced',
          stickyScroll: { enabled: false },
          padding: { top: 8, bottom: 48 },
          links: false,
          colorDecorators: false,
          readOnly: false,
          domReadOnly: false,
          // Important for mobile caret/keyboard
          accessibilitySupport: 'off',
          mouseWheelZoom: false,
          // Extra bottom space so last lines aren't under the soft keyboard
          scrollbar: {
            verticalScrollbarSize: 10,
            horizontalScrollbarSize: 10,
            alwaysConsumeMouseWheel: false
          }
        });

        editor.onDidChangeModelContent(function () {
          if (applyingExternalEdit) return;
          postRN({ type: 'change', content: editor.getValue(), path: currentPath });
        });

        editor.onDidChangeCursorPosition(function (e) {
          postRN({
            type: 'cursor',
            line: e.position.lineNumber,
            column: e.position.column
          });
        });

        editor.onDidChangeCursorSelection(function () {
          if (mobileSelectionActive) requestAnimationFrame(updateMobileSelection);
        });
        editor.onDidScrollChange(function () {
          if (mobileSelectionActive) requestAnimationFrame(updateMobileSelection);
        });

        // Ctrl/Cmd+S from hardware keyboard
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
          postRN({ type: 'saveRequest', path: currentPath, content: editor.getValue() });
        });

        wireMobileEditing(host);
        // Layout after create — zero-size layout kills input on some WebViews
        setTimeout(function () {
          try { editor.layout(); } catch (e) {}
          forceKeyboardFocus();
        }, 100);

        postRN({ type: 'ready' });
      } catch (e) {
        reportFatal('create', e);
      }
    }, function (err) {
      reportFatal('require', err);
    });

    document.addEventListener('message', function (event) { handleMessage(event.data); });
    window.addEventListener('message', function (event) { handleMessage(event.data); });

    function handleMessage(data) {
      try {
        var message = JSON.parse(data);
        switch (message.type) {
          case 'openFile':
            openFile(message.path, message.content, message.language);
            break;
          case 'setContent':
            if (editor) {
              applyingExternalEdit = true;
              try { editor.setValue(message.content || ''); } finally { applyingExternalEdit = false; }
            }
            break;
          case 'getContent':
            if (editor) postRN({ type: 'content', content: editor.getValue(), path: currentPath });
            break;
          case 'setTheme':
            if (editor) {
              monaco.editor.setTheme(message.theme === 'dark' ? 'mobileide-dark' : 'mobileide-light');
            }
            break;
          case 'setFontSize':
            if (editor) {
              currentFontSize = Math.max(8, Math.min(32, Number(message.size) || 14));
              editor.updateOptions({
                fontSize: currentFontSize,
                lineHeight: Math.round(currentFontSize * 1.55)
              });
            }
            break;
          case 'setWordWrap':
            if (editor) editor.updateOptions({ wordWrap: message.enabled ? 'on' : 'off' });
            break;
          case 'setTabSize':
            if (editor) editor.updateOptions({ tabSize: message.size });
            break;
          case 'format':
            if (editor) {
              var act = editor.getAction('editor.action.formatDocument');
              if (act) act.run();
            }
            break;
          case 'undo':
            if (editor) editor.trigger('keyboard', 'undo', null);
            break;
          case 'redo':
            if (editor) editor.trigger('keyboard', 'redo', null);
            break;
          case 'find':
            if (editor) {
              var find = editor.getAction('actions.find');
              if (find) find.run();
            }
            break;
          case 'search':
            runSearch(message.query, message.direction === 'previous' ? 'previous' : 'next');
            break;
          case 'replace':
            replaceSearchMatch(message.query, message.replacement, false);
            break;
          case 'replaceAll':
            replaceSearchMatch(message.query, message.replacement, true);
            break;
          case 'pasteText':
            replaceSelection(message.text || '', 'mobile-paste');
            break;
          case 'goToLine':
            if (editor) {
              editor.revealLineInCenter(message.line);
              editor.setPosition({ lineNumber: message.line, column: 1 });
            }
            break;
          case 'goToLocation':
            if (editor) {
              var location = {
                lineNumber: Math.max(1, Number(message.line) || 1),
                column: Math.max(1, Number(message.column) || 1)
              };
              editor.setPosition(location);
              editor.revealPositionInCenter(location);
              editor.focus();
            }
            break;
          case 'focus':
            forceKeyboardFocus();
            break;
          case 'blur':
            if (editor) {
              try {
                var ta = document.querySelector('.monaco-editor .inputarea');
                if (ta) ta.blur();
              } catch (e) {}
            }
            break;
          case 'layout':
            if (editor) {
              try { editor.layout(); } catch (e) {}
            }
            break;
          case 'copy':
            if (editor) {
              var sel = editor.getModel().getValueInRange(editor.getSelection());
              postRN({ type: 'copyText', text: sel || editor.getValue() });
            }
            break;
        }
      } catch (e) {
        console.error('Error handling message:', e);
      }
    }

    function openFile(path, content, language) {
      if (!editor) return;
      currentPath = path || '';
      var lang = language || 'plaintext';
      var uri = monaco.Uri.parse('inmemory://model/' + encodeURIComponent(path || 'untitled'));
      var model = models.get(path);
      applyingExternalEdit = true;
      try {
        if (model) {
          // content === null means "keep buffer" (same file, path already open).
          // Only setValue when RN sends a real string (file switch / external reload).
          if (content !== null && content !== undefined && typeof content === 'string') {
            if (model.getValue() !== content) {
              model.setValue(content);
            }
          }
          if (model.getLanguageId() !== lang) {
            monaco.editor.setModelLanguage(model, lang);
          }
        } else {
          model = monaco.editor.createModel(
            (content !== null && content !== undefined) ? content : '',
            lang,
            uri
          );
          models.set(path, model);
        }
        editor.setModel(model);
        currentModel = model;
      } finally {
        applyingExternalEdit = false;
      }
      postRN({ type: 'fileOpened', path: path });
      setTimeout(forceKeyboardFocus, 30);
      setTimeout(function () { try { editor.layout(); } catch (e) {} }, 60);
    }

    // Visual viewport changes (keyboard show/hide) — re-layout Monaco
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        if (editor) {
          try { editor.layout(); } catch (e) {}
        }
      });
    }
    window.addEventListener('resize', function () {
      if (editor) {
        try { editor.layout(); } catch (e) {}
      }
    });
  </script>
</body>
</html>
