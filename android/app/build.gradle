apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mobileide.app"
    defaultConfig {
        applicationId "com.mobileide.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.3.4"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
        jniLibs {
            // Legacy packaging keeps native libs uncompressed and extracted to
            // nativeLibraryDir at install time, which is the ONLY app-owned
            // exec-permitted location on Android 10+ (targetSdk 34).
            useLegacyPackaging = true
        }
        // Our runtime executables (node, git, bash, ...) are shipped AS lib*.so.
        // They are real ARM64 ELF binaries and MUST NOT be stripped/altered by AGP.
        doNotStrip "*/arm64-v8a/lib*.so"
    }
    // The runtime binaries are relocated into jniLibs by prepareRuntimeNativeLibs.
    sourceSets {
        main {
            jniLibs.srcDirs += file("src/main/jniLibs")
        }
    }
}

/**
 * Relocate the bundled developer runtime.
 *
 * Android forbids execve() of any file living in the writable data dir
 * (filesDir/runtime/bin). The one app-owned, exec-permitted location is
 * nativeLibraryDir, which is populated from lib*.so entries in jniLibs.
 *
 * This task scans src/main/assets/runtime for real ELF binaries, copies each
 * one to src/main/jniLibs/arm64-v8a/lib<mangled>.so (de-duplicated by content
 * hash so identical git builtins share a single .so), writes a JSON map of
 * originalRelPath -> libName to assets/runtime/native-map.json, and removes the
 * original ELF from assets so it is not packaged twice. RuntimeManager reads the
 * map at runtime and rebuilds a symlink farm pointing at nativeLibraryDir.
 *
 * Non-ELF support files (JS, shell scripts, config) are left in assets and are
 * extracted normally.
 */
def runtimeAssetsDir = file("src/main/assets/runtime")
def jniLibsArm64Dir = file("src/main/jniLibs/arm64-v8a")
def nativeMapFile = new File(runtimeAssetsDir, "native-map.json")

def isElfFile = { java.io.File f ->
    if (!f.isFile() || f.length() < 4L) return false
    f.withInputStream { ins ->
        byte[] magic = new byte[4]
        int n = ins.read(magic)
        return n == 4 && (magic[0] & 0xFF) == 0x7F && magic[1] == (byte) 'E' && magic[2] == (byte) 'L' && magic[3] == (byte) 'F'
    }
}

def sha256Hex = { java.io.File f ->
    def md = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { ins ->
        byte[] buf = new byte[16384]
        int r
        while ((r = ins.read(buf)) != -1) md.update(buf, 0, r)
    }
    return md.digest().collect { String.format("%02x", it & 0xFF) }.join("")
}

def mangleLibName = { String relPath ->
    "lib" + relPath.replaceAll("[^a-zA-Z0-9]+", "_") + ".so"
}

/**
 * Android asset packaging drops directories whose names start with '_'.
 * npm's @sigstore/protobuf-specs uses dist/__generated__/ which must be
 * renamed to dist/generated/ (and JS requires rewritten) or every `npm`
 * invocation fails with MODULE_NOT_FOUND for './generated/envelope'.
 * This task is a safety net in case fetch-runtime.sh was skipped.
 */
task sanitizeRuntimeNpmAssets {
    description = "Rename underscore-prefixed npm dirs so aapt packages them"
    doLast {
        def npmRoot = new File(runtimeAssetsDir, "lib/node_modules")
        if (!npmRoot.exists()) {
            logger.lifecycle("[runtime] no npm tree; skipping underscore sanitize")
            return
        }
        // Deepest first so nested renames stay valid.
        def dirs = []
        npmRoot.eachDirRecurse { d ->
            if (d.name.startsWith("_")) dirs << d
        }
        dirs.sort { -it.absolutePath.length() }
        int renamed = 0
        dirs.each { d ->
            def newName = d.name.replaceFirst(/^_+/, "")
            if (newName.isEmpty() || newName == d.name) return
            def target = new File(d.parentFile, newName)
            if (target.exists()) {
                logger.warn("[runtime] skip rename ${d.name}: ${target} exists")
                return
            }
            if (d.renameTo(target)) {
                renamed++
                logger.lifecycle("[runtime] renamed ${d.name} -> ${newName}")
            }
        }
        // Patch JS require paths still pointing at __generated__
        int patched = 0
        npmRoot.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith(".js")) return
            def text = f.getText("UTF-8")
            if (!text.contains("__generated__")) return
            f.write(text.replace("__generated__", "generated"), "UTF-8")
            patched++
        }
        logger.lifecycle("[runtime] sanitize npm assets: renamed=${renamed} patchedJs=${patched}")
    }
}

task prepareRuntimeNativeLibs {
    description = "Relocate ELF runtime binaries from assets into jniLibs as lib*.so"
    dependsOn sanitizeRuntimeNpmAssets
    doLast {
        if (!runtimeAssetsDir.exists()) {
            logger.lifecycle("[runtime] no runtime assets dir; skipping relocation")
            return
        }
        jniLibsArm64Dir.mkdirs()

        // Merge with any previously generated map so the task is idempotent.
        def map = [:]
        if (nativeMapFile.exists()) {
            try {
                map = new groovy.json.JsonSlurper().parse(nativeMapFile) as Map
            } catch (ignored) {
                map = [:]
            }
        }

        def hashToLib = [:]
        int relocated = 0
        runtimeAssetsDir.traverse(type: groovy.io.FileType.FILES) { java.io.File f ->
            if (f == nativeMapFile) return
            if (!isElfFile(f)) return
            def relPath = runtimeAssetsDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            def hash = sha256Hex(f)
            def libName = hashToLib[hash]
            if (libName == null) {
                libName = mangleLibName(relPath)
                new File(jniLibsArm64Dir, libName).bytes = f.bytes
                hashToLib[hash] = libName
            }
            map[relPath] = libName
            f.delete()
            relocated++
        }

        nativeMapFile.parentFile.mkdirs()
        nativeMapFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(map))
        logger.lifecycle("[runtime] relocated ${relocated} ELF binaries; native-map has ${map.size()} entries -> ${jniLibsArm64Dir}")
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn prepareRuntimeNativeLibs
}

/**
 * CMake builds adev-npm-shell as an executable named libbin_adev_npm_shell.so.
 * AGP only auto-packages SHARED libraries. Its assemble graph invokes
 * buildCMake<Variant> directly (not externalNativeBuild<Variant>), so make the
 * JNI merge explicitly depend on a variant-specific copy of the fresh output.
 * This avoids packaging the previous build's lifecycle shell.
 */
def registerAdevNpmShellSync = { String variantName, String cmakeVariant ->
    def capitalized = variantName.capitalize()
    def syncTask = tasks.register("sync${capitalized}AdevNpmShell") {
        dependsOn tasks.matching { it.name == "buildCMake${cmakeVariant}" }
        doLast {
            def abi = "arm64-v8a"
            def candidates = []
            [
                file("${buildDir}/intermediates/cxx/${cmakeVariant}"),
                file("${projectDir}/.cxx/${cmakeVariant}")
            ].each { root ->
                if (root.exists()) {
                    root.eachFileRecurse { f ->
                        if (f.isFile() && f.name == "libbin_adev_npm_shell.so" &&
                                f.absolutePath.replace('\\', '/').contains("/obj/${abi}/")) {
                            candidates << f
                        }
                    }
                }
            }
            def found = candidates.sort { a, b -> b.lastModified() <=> a.lastModified() }.find()
            if (found == null) {
                throw new GradleException(
                    "Fresh libbin_adev_npm_shell.so not found for ${variantName}/${abi}"
                )
            }
            def destDir = file("src/main/jniLibs/${abi}")
            destDir.mkdirs()
            def dest = new File(destDir, "libbin_adev_npm_shell.so")
            dest.bytes = found.bytes
            logger.lifecycle(
                "[runtime] synced ${variantName} adev-npm-shell -> ${dest} (${dest.length()} bytes)"
            )
        }
    }
    tasks.matching { it.name == "merge${capitalized}JniLibFolders" }.configureEach {
        dependsOn syncTask
    }
}

registerAdevNpmShellSync("debug", "Debug")
registerAdevNpmShellSync("release", "RelWithDebInfo")

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // JGit - pure Java git implementation for Git UI panel
    implementation("org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r")
    implementation("org.slf4j:slf4j-nop:1.7.36")
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
