import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def versionFile = rootProject.file("../version.json")
if (!versionFile.isFile()) {
    throw new GradleException("Missing ${versionFile}; version.json is the release version authority.")
}
def releaseVersion = new JsonSlurper().parse(versionFile)
def openCodeManifestFile = file("src/main/assets/runtime/lib/adev-opencode.json")
if (!openCodeManifestFile.isFile()) {
    throw new GradleException("Missing ${openCodeManifestFile}; OpenCode launcher version cannot be configured.")
}
def openCodeManifest = new JsonSlurper().parse(openCodeManifestFile)
if (!(openCodeManifest.version instanceof String) || openCodeManifest.version.isBlank()) {
    throw new GradleException("${openCodeManifestFile} must declare a non-empty string version.")
}
def releaseSigningEnvironment = [
    storeFile: System.getenv("ADEV_RELEASE_STORE_FILE"),
    storePassword: System.getenv("ADEV_RELEASE_STORE_PASSWORD"),
    keyAlias: System.getenv("ADEV_RELEASE_KEY_ALIAS"),
    keyPassword: System.getenv("ADEV_RELEASE_KEY_PASSWORD")
]
def configuredSigningValues = releaseSigningEnvironment.values().count { it != null && !it.isBlank() }
if (configuredSigningValues > 0 && configuredSigningValues < releaseSigningEnvironment.size()) {
    throw new GradleException(
        "Partial Android release signing configuration. Set all ADEV_RELEASE_STORE_FILE, " +
        "ADEV_RELEASE_STORE_PASSWORD, ADEV_RELEASE_KEY_ALIAS, and ADEV_RELEASE_KEY_PASSWORD values."
    )
}
def releaseSigningReady = configuredSigningValues == releaseSigningEnvironment.size()
def releaseStoreFile = releaseSigningReady ? file(releaseSigningEnvironment.storeFile).canonicalFile : null
if (releaseSigningReady) {
    def repositoryRoot = rootProject.projectDir.parentFile.canonicalFile.toPath()
    if (!releaseStoreFile.isFile()) {
        throw new GradleException("ADEV_RELEASE_STORE_FILE does not exist: ${releaseStoreFile}")
    }
    if (releaseStoreFile.toPath().startsWith(repositoryRoot)) {
        throw new GradleException(
            "The production keystore must stay outside the Git repository: ${releaseStoreFile}"
        )
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// CMake/Ninja on Windows still rejects generated React Native object paths
// above MAX_PATH. Keep its persistent staging graph under a short,
// clone-specific user path; other hosts retain the normal module-local path.
def nativeBuildWorkspaceKey = java.security.MessageDigest
    .getInstance("SHA-256")
    .digest(projectDir.canonicalPath.toLowerCase(Locale.ROOT).getBytes("UTF-8"))
    .encodeHex()
    .toString()
    .substring(0, 12)
def nativeBuildStagingOverride = System.getenv("ADEV_NATIVE_BUILD_STAGING_DIR")
def nativeBuildStagingDir = nativeBuildStagingOverride
    ? file(nativeBuildStagingOverride)
    : (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
        ? new File(System.getProperty("user.home"), ".adev-cxx/${nativeBuildWorkspaceKey}")
        : file(".cxx"))
def linuxRuntimeTestAssetsDir = file("${buildDir}/generated/assets/adevLinuxRuntimeTest")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mobileide.app"
    androidResources {
        // AAPT's default pattern drops underscore directories and all dot
        // entries. That silently removes Python's zipfile/_path, libc++'s
        // __algorithm tree, and package-manager .bin commands/.npmrc files.
        // Retain those runtime inputs while still excluding VCS/editor junk.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
    defaultConfig {
        applicationId "com.mobileide.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (releaseVersion.versionCode as Integer)
        versionName releaseVersion.versionName as String
        buildConfigField "String", "ADEV_RUNTIME_VERSION", "\"${releaseVersion.runtimeVersion}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared",
                    "-DADEV_OPENCODE_VERSION=${openCodeManifest.version}"
            }
        }
    }
    // Build instrumentation against the same release-mode, debug-key signed
    // package that users install for phone compatibility testing. The target
    // app remains non-debuggable; the separate test APK runs under the standard
    // AndroidJUnitRunner and can validate the app-private runtime without
    // relying on `adb run-as` or clearing developer workspaces.
    testBuildType "phoneTest"
    externalNativeBuild {
        cmake {
            // Preserve React Native's appmodules/autolinking entrypoint while
            // building MobileIDE's PTY and command helpers in a subdirectory.
            path "src/main/jni/CMakeLists.txt"
            version "3.31.6"
            buildStagingDirectory nativeBuildStagingDir
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        phoneTest {
            initWith release
            // Standalone, release-mode test package for physical-device
            // compatibility testing. It is deliberately separate from the
            // production application and never qualifies as a release signer.
            applicationIdSuffix ".phonetest"
            versionNameSuffix "-phone-test"
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            matchingFallbacks = ["release"]
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
        jniLibs {
            // Legacy packaging keeps native libs uncompressed and extracted to
            // nativeLibraryDir at install time, which is the ONLY app-owned
            // exec-permitted location on Android 10+ (targetSdk 34).
            useLegacyPackaging = true
        }
        // Our runtime executables (node, git, bash, ...) are shipped AS lib*.so.
        // They are real ARM64 ELF binaries and MUST NOT be stripped/altered by AGP.
        doNotStrip "*/arm64-v8a/lib*.so"
        doNotStrip "*/x86_64/lib*.so"
    }
    // The runtime binaries are relocated into jniLibs by prepareRuntimeNativeLibs.
    sourceSets {
        main {
            jniLibs.srcDirs += file("src/main/jniLibs")
        }
        // The optional Linux-user archive is intentionally excluded from the
        // production APK. Instrumentation alone receives the release artifact
        // so device tests can exercise the same checksum/install flow users do.
        androidTest {
            assets.srcDirs += linuxRuntimeTestAssetsDir
        }
    }
}

// AAPT automatically inflates files named *.gz. Give the test-only copy an
// opaque suffix so instrumentation receives the exact published bytes and can
// exercise the same SHA-256 verification as an on-device download.
def prepareAdevLinuxRuntimeTestAssets = tasks.register(
    "prepareAdevLinuxRuntimeTestAssets",
    Copy
) {
    from(rootProject.file("../release/linux")) {
        include "*.tar.gz"
        rename { String name -> name.replaceFirst(/\.tar\.gz$/, ".pack") }
    }
    into linuxRuntimeTestAssetsDir
}
tasks.configureEach { task ->
    if (task.name == "mergePhoneTestAndroidTestAssets") {
        task.dependsOn prepareAdevLinuxRuntimeTestAssets
    }
}

/**
 * Relocate the bundled developer runtime.
 *
 * Android forbids execve() of any file living in the writable data dir
 * (filesDir/runtime/bin). The one app-owned, exec-permitted location is
 * nativeLibraryDir, which is populated from lib*.so entries in jniLibs.
 *
 * This task scans src/main/assets/runtime for real ELF binaries, copies each
 * one to src/main/jniLibs/arm64-v8a/lib<mangled>.so (de-duplicated by content
 * hash so identical git builtins share a single .so), writes a JSON map of
 * originalRelPath -> libName to assets/runtime/native-map.json, and removes the
 * original ELF from assets so it is not packaged twice. RuntimeManager reads the
 * map at runtime and rebuilds a symlink farm pointing at nativeLibraryDir.
 *
 * Non-ELF support files (JS, shell scripts, config) are left in assets and are
 * extracted normally.
 */
def runtimeAssetsDir = file("src/main/assets/runtime")
def jniLibsArm64Dir = file("src/main/jniLibs/arm64-v8a")
def nativeMapFile = new File(runtimeAssetsDir, "native-map.json")

def isElfFile = { java.io.File f ->
    if (!f.isFile() || f.length() < 4L) return false
    f.withInputStream { ins ->
        byte[] magic = new byte[4]
        int n = ins.read(magic)
        return n == 4 && (magic[0] & 0xFF) == 0x7F && magic[1] == (byte) 'E' && magic[2] == (byte) 'L' && magic[3] == (byte) 'F'
    }
}

def sha256Hex = { java.io.File f ->
    def md = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { ins ->
        byte[] buf = new byte[16384]
        int r
        while ((r = ins.read(buf)) != -1) md.update(buf, 0, r)
    }
    return md.digest().collect { String.format("%02x", it & 0xFF) }.join("")
}

def openCodeRuntimeArchive = file("src/main/prebuilt/arm64-v8a/libbin_opencode_runtime.so.gz")
def openCodeRuntimeBinary = new File(jniLibsArm64Dir, "libbin_opencode_runtime.so")
def openCodeRuntimeSha256 = "e5079d3c6b974bb6693e033fd292e38dc5342e022c96e8f32b4127ba7d293862"
def openTuiArchive = file("src/main/prebuilt/arm64-v8a/liblib_opencode_opentui.so.gz")
def openTuiBinary = new File(jniLibsArm64Dir, "liblib_opencode_opentui.so")
def openTuiSha256 = "0b16d269a096ed8f362956c93257b369f68de3c8e846299926cbf51d912e2e4a"
def glibcLoaderArchive = file("src/main/prebuilt/arm64-v8a/libbin_adev_glibc_ld.so.gz")
def glibcLoaderBinary = new File(jniLibsArm64Dir, "libbin_adev_glibc_ld.so")
def glibcLoaderSha256 = "02993e282185a05cdbd5ebd02bbbb3d8f494ad16320f2c58ce37483de4940859"
def nodePtyAddonArchive = file("src/main/prebuilt/arm64-v8a/liblib_adev_native_addons_node_pty_1_2_0_beta_15_android_arm64_pty_node.so.gz")
def nodePtyAddonBinary = new File(jniLibsArm64Dir, "liblib_adev_native_addons_node_pty_1_2_0_beta_15_android_arm64_pty_node.so")
def nodePtyAddonSha256 = "021da78d1cf0efdc41e5c46460fea178e87359c6d2893aab2aafb43ed8d2a07e"
def koffiAddonArchive = file("src/main/prebuilt/arm64-v8a/liblib_adev_native_addons_koffi_3_1_6_android_arm64_koffi_node.so.gz")
def koffiAddonBinary = new File(jniLibsArm64Dir, "liblib_adev_native_addons_koffi_3_1_6_android_arm64_koffi_node.so")
def koffiAddonSha256 = "b966208920c804d167bdd442132d102b55cb11c352af5fc526bad4bb53119bff"

def restoreGzipPayload = { java.io.File archive, java.io.File binary, String expectedSha256, String label ->
    if (!archive.isFile()) {
        throw new GradleException("Missing pinned ${label} archive: ${archive}")
    }
    binary.parentFile.mkdirs()
    def temporaryBinary = new File(binary.parentFile, "${binary.name}.tmp")
    try {
        archive.withInputStream { archiveInput ->
            new java.util.zip.GZIPInputStream(archiveInput).withCloseable { gzipInput ->
                temporaryBinary.withOutputStream { output -> gzipInput.transferTo(output) }
            }
        }
        def restoredHash = sha256Hex(temporaryBinary)
        if (restoredHash != expectedSha256) {
            throw new GradleException(
                "${label} SHA-256 mismatch: expected ${expectedSha256}, got ${restoredHash}"
            )
        }
        java.nio.file.Files.move(
            temporaryBinary.toPath(),
            binary.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
        )
        logger.lifecycle("[runtime] restored pinned ${label} from gzip")
    } finally {
        temporaryBinary.delete()
    }
}

task restoreOpenCodeRuntime {
    description = "Restore pinned ARM64 OpenCode/OpenTUI binaries from Git-friendly gzip payloads"
    inputs.files(openCodeRuntimeArchive, openTuiArchive)
    outputs.files(openCodeRuntimeBinary, openTuiBinary)
    outputs.upToDateWhen {
        openCodeRuntimeBinary.isFile() &&
            sha256Hex(openCodeRuntimeBinary) == openCodeRuntimeSha256 &&
            openTuiBinary.isFile() &&
            sha256Hex(openTuiBinary) == openTuiSha256
    }
    doLast {
        restoreGzipPayload(openCodeRuntimeArchive, openCodeRuntimeBinary, openCodeRuntimeSha256, "OpenCode ARM64 payload")
        restoreGzipPayload(openTuiArchive, openTuiBinary, openTuiSha256, "OpenTUI ARM64 renderer")
    }
}

task restoreAdevGlibcLoader {
    description = "Restore the genuine ARM64 glibc loader exec anchor for the optional runtime pack"
    inputs.file(glibcLoaderArchive)
    outputs.file(glibcLoaderBinary)
    outputs.upToDateWhen {
        glibcLoaderBinary.isFile() && sha256Hex(glibcLoaderBinary) == glibcLoaderSha256
    }
    doLast {
        restoreGzipPayload(
            glibcLoaderArchive,
            glibcLoaderBinary,
            glibcLoaderSha256,
            "ADEV optional glibc 2.44 ARM64 loader",
        )
    }
}

task restoreAdevCliAddons {
    description = "Restore pinned ARM64 Node-API addons used by Android CLI compatibility rules"
    inputs.files(nodePtyAddonArchive, koffiAddonArchive)
    outputs.files(nodePtyAddonBinary, koffiAddonBinary)
    outputs.upToDateWhen {
        nodePtyAddonBinary.isFile() &&
            sha256Hex(nodePtyAddonBinary) == nodePtyAddonSha256 &&
            koffiAddonBinary.isFile() &&
            sha256Hex(koffiAddonBinary) == koffiAddonSha256
    }
    doLast {
        restoreGzipPayload(
            nodePtyAddonArchive,
            nodePtyAddonBinary,
            nodePtyAddonSha256,
            "node-pty 1.2.0-beta.15 Android ARM64 addon",
        )
        restoreGzipPayload(
            koffiAddonArchive,
            koffiAddonBinary,
            koffiAddonSha256,
            "Koffi 3.1.6 Android ARM64 addon",
        )
    }
}

def mangleLibName = { String relPath ->
    "lib" + relPath.replaceAll("[^a-zA-Z0-9]+", "_") + ".so"
}

/**
 * Android asset packaging drops directories whose names start with '_'.
 * npm's @sigstore/protobuf-specs uses dist/__generated__/ which must be
 * renamed to dist/generated/ (and JS requires rewritten) or every `npm`
 * invocation fails with MODULE_NOT_FOUND for './generated/envelope'.
 * This task is a safety net in case fetch-runtime.sh was skipped.
 */
task sanitizeRuntimeNpmAssets {
    description = "Rename underscore-prefixed npm dirs so aapt packages them"
    doLast {
        def npmRoot = new File(runtimeAssetsDir, "lib/node_modules")
        if (!npmRoot.exists()) {
            logger.lifecycle("[runtime] no npm tree; skipping underscore sanitize")
            return
        }
        // Deepest first so nested renames stay valid.
        def dirs = []
        npmRoot.eachDirRecurse { d ->
            if (d.name.startsWith("_")) dirs << d
        }
        dirs.sort { -it.absolutePath.length() }
        int renamed = 0
        dirs.each { d ->
            def newName = d.name.replaceFirst(/^_+/, "")
            if (newName.isEmpty() || newName == d.name) return
            def target = new File(d.parentFile, newName)
            if (target.exists()) {
                logger.warn("[runtime] skip rename ${d.name}: ${target} exists")
                return
            }
            if (d.renameTo(target)) {
                renamed++
                logger.lifecycle("[runtime] renamed ${d.name} -> ${newName}")
            }
        }
        // Patch JS require paths still pointing at __generated__
        int patched = 0
        npmRoot.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith(".js")) return
            def text = f.getText("UTF-8")
            if (!text.contains("__generated__")) return
            f.write(text.replace("__generated__", "generated"), "UTF-8")
            patched++
        }
        logger.lifecycle("[runtime] sanitize npm assets: renamed=${renamed} patchedJs=${patched}")
    }
}

task prepareRuntimeNativeLibs {
    description = "Relocate ELF runtime binaries from assets into jniLibs as lib*.so"
    dependsOn sanitizeRuntimeNpmAssets, "pruneRuntimeNativeLibs", restoreOpenCodeRuntime, restoreAdevGlibcLoader, restoreAdevCliAddons
    doLast {
        if (!runtimeAssetsDir.exists()) {
            logger.lifecycle("[runtime] no runtime assets dir; skipping relocation")
            return
        }
        jniLibsArm64Dir.mkdirs()

        // Merge with any previously generated map so the task is idempotent.
        def map = [:]
        if (nativeMapFile.exists()) {
            try {
                map = new groovy.json.JsonSlurper().parse(nativeMapFile) as Map
            } catch (ignored) {
                map = [:]
            }
        }

        def hashToLib = [:]
        int relocated = 0
        runtimeAssetsDir.traverse(type: groovy.io.FileType.FILES) { java.io.File f ->
            if (f == nativeMapFile) return
            if (!isElfFile(f)) return
            def relPath = runtimeAssetsDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            def hash = sha256Hex(f)
            def libName = hashToLib[hash]
            if (libName == null) {
                libName = mangleLibName(relPath)
                new File(jniLibsArm64Dir, libName).bytes = f.bytes
                hashToLib[hash] = libName
            }
            map[relPath] = libName
            f.delete()
            relocated++
        }

        nativeMapFile.parentFile.mkdirs()
        nativeMapFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(map))
        logger.lifecycle("[runtime] relocated ${relocated} ELF binaries; native-map has ${map.size()} entries -> ${jniLibsArm64Dir}")
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn prepareRuntimeNativeLibs
}

/**
 * CMake builds the npm shell, Make shell bridge, Git credential helper, and
 * OpenCode launcher as executable lib*.so files.
 * AGP only auto-packages SHARED libraries. Its assemble graph invokes
 * buildCMake<Variant> directly (not externalNativeBuild<Variant>), so make the
 * JNI merge explicitly depend on a variant-specific copy of the fresh output.
 * This avoids packaging the previous build's lifecycle shell.
 */
def registerAdevNativeHelpersSync = { String variantName, String cmakeVariant ->
    def capitalized = variantName.capitalize()
    def syncTask = tasks.register("sync${capitalized}AdevNpmShell") {
        dependsOn tasks.matching { it.name == "buildCMake${cmakeVariant}" }
        doLast {
            def abis = ["arm64-v8a", "x86_64"]
            def helperNames = [
                "libbin_adev_npm_shell.so",
                "libbin_adev_busybox.so",
                "libbin_adev_env.so",
                "libbin_adev_glibc_loader.so",
                "libbin_adev_make.so",
                "libbin_adev_ld_lld.so",
                "libbin_adev_git_credential.so",
                "libbin_adev_xdg_open.so",
                "libbin_adev_git_launcher.so",
                "libbin_adev_secret.so",
                "libbin_opencode.so",
                "liblib_adev_exec_compat.so",
                "liblib_adev_linux_compat.so",
                "liblib_adev_opencode_compat.so"
            ]
            def candidates = [:].withDefault { [:].withDefault { [] } }
            [
                file("${buildDir}/intermediates/cxx/${cmakeVariant}"),
                file("${projectDir}/.cxx/${cmakeVariant}"),
                file("${nativeBuildStagingDir}/${cmakeVariant}")
            ].each { root ->
                if (root.exists()) {
                    root.eachFileRecurse { f ->
                        if (f.isFile() && helperNames.contains(f.name)) {
                            def normalized = f.absolutePath.replace('\\', '/')
                            abis.each { abi ->
                                if (normalized.contains("/obj/${abi}/")) {
                                    candidates[abi][f.name] << f
                                }
                            }
                        }
                    }
                }
            }
            abis.each { abi ->
                def destDir = file("src/main/jniLibs/${abi}")
                destDir.mkdirs()
                helperNames.each { helperName ->
                    def found = candidates[abi][helperName]
                        .sort { a, b -> b.lastModified() <=> a.lastModified() }
                        .find()
                    if (found == null) {
                        throw new GradleException(
                            "Fresh ${helperName} not found for ${variantName}/${abi}"
                        )
                    }
                    def dest = new File(destDir, helperName)
                    dest.bytes = found.bytes
                    logger.lifecycle(
                        "[runtime] synced ${variantName}/${abi} ${helperName} -> ${dest} (${dest.length()} bytes)"
                    )
                }
            }
        }
    }
    tasks.matching { it.name == "merge${capitalized}JniLibFolders" }.configureEach {
        dependsOn syncTask
    }
}

tasks.register("pruneRuntimeNativeLibs", Exec) {
    description = "Prune only stale JNI/map outputs owned by the signed runtime lock"
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "scripts/prune-runtime-owned.mjs", "--apply"
}

gradle.taskGraph.whenReady { graph ->
    def productionArtifactRequested =
        graph.hasTask("${project.path}:assembleRelease") ||
        graph.hasTask("${project.path}:bundleRelease")
    if (productionArtifactRequested && !releaseSigningReady) {
        throw new GradleException(
            "Production release signing is not configured. Keep credentials outside Git and set " +
            "ADEV_RELEASE_STORE_FILE, ADEV_RELEASE_STORE_PASSWORD, ADEV_RELEASE_KEY_ALIAS, " +
            "and ADEV_RELEASE_KEY_PASSWORD. Debug signing is never used for release artifacts."
        )
    }
}

registerAdevNativeHelpersSync("debug", "Debug")
registerAdevNativeHelpersSync("release", "RelWithDebInfo")
registerAdevNativeHelpersSync("phoneTest", "RelWithDebInfo")

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.documentfile:documentfile:1.0.0")

    // JGit - pure Java git implementation for Git UI panel
    implementation("org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r")
    implementation("org.slf4j:slf4j-nop:1.7.36")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
